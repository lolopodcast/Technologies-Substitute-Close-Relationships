                },
                content: [
                    {
                        title: "Course Overview",
                        desc: "This interactive module deconstructs how 'Technology Popularization (X)' via 'Digital Substitution (Me1)' and 'Solitary Tendency (Me2)' leads to the macro-demographic phenomenon of 'Asexual and Childless trends (Y)'.\n\nThis proposal demonstrates strong theoretical integration, linking macro demographic collapse to micro psychological mechanisms. Learners will clarify construct boundaries, exploring substitution from entertainment to intimacy. We examine 'Responsibility Transfer', exploring how individuals cognitively rationalize not entering relationships.\n\nThe module also covers the moderating effects of structural variables (economic pressure, gender structure) and empirical validation via advanced quantitative techniques like SEM.",

                    {

                    {
                        title: "2. Responsibility Transfer & Withdrawal (Me2)",
                        desc: "The theoretical innovation here is deepening 'Solitary Tendency (Me2)' into both cognitive and behavioral dimensions. Traditional literature focuses on 'Social Withdrawal' or 'libido inhibition'. This model introduces 'Responsibility Transfer'.\n\nThis means: individuals aren't just 'unable' to form relationships; they cognitively rationalize 'refusing' emotional labor and social roles, viewing relationships as high-risk, low-yield burdens.\n\nIn measurement, these variables must be handled carefully. They might be Correlated Mediators rather than a single Latent Construct.",
                        highlights: ["Core Innovation: Responsibility Transfer", "From 'inability' to cognitive 'refusal'", "Measurement of Latent vs. Correlated variables"],
                        cards: [
                            { front: "Solitary Tendency", back: "Not just behavioral isolation, but rejection of relationship responsibilities." },
                            { front: "Social Withdrawal", back: "Reducing physical participation, preferring controllable private spaces." },

                        quiz: [

                            { q: "What is the main measurement challenge for Me2?", options: ["Untranslatable to English", "Social desirability bias", "These dimensions may not form a single latent construct", "High printing costs"], ans: 2 }

                    {
                        title: "3. The Vicious Cycle (Me1 ↺ Me2)",

                        ]
                    },
                    {
                        title: "4. Endgame Effect (Y)",
                        desc: "Treating 'Asexual/Childless' as a single outcome (Y) is theoretically ambitious but empirically risky due to high heterogeneity. Dating, sex, marriage, and childbirth involve vastly different timeframes and costs.\n\nThis proposal suggests deconstructing Y into stages: Y1 (dating decline) → Y2 (sex frequency drop) → Y3 (marriage/fertility intention collapse).\n\nFurthermore, we must avoid the Ecological Fallacy (crossing levels of analysis). Inferring macro national demographic collapse from micro psychological mechanisms requires arguing a 'plausible mechanism', not a direct equation.",
                        highlights: ["Deconstructing Y: Y1, Y2, Y3", "Differing timeframes and costs", "Beware Ecological Fallacy"],

                            { front: "Multi-group Analysis", back: "Comparing SEM path coefficients across different groups." },

                        ],

                            { q: "Which tone is most appropriate for a rigorous proposal?", options: ["Tech is proven to destroy humanity", "The model expects tech to affect intentions via specific mechanisms, pending validation", "Smartphones solely cause childlessness", "Unplugging the internet will fix birth rates"], ans: 1 }

        // --- SVG 圖像工廠 (TopicSVG) ---
        const TopicSVG = ({ tabIndex, isDark }) => {
            const strokeColor = isDark ? "#C5A97A" : "#0A3254"; 
            const bgColor = isDark ? "#1F2937" : "#F3F4F6";
            const textColor = isDark ? "#F3F4F6" : "#0A3254";

            if (tabIndex === 0) return (
                <svg viewBox="0 0 800 300" className="w-full h-full drop-shadow-md">
                    <rect width="100%" height="100%" fill={bgColor} rx="10"/>
                    <text x="400" y="40" fill={textColor} fontSize="20" fontWeight="bold" textAnchor="middle">研究概念模型總覽 (Conceptual Model)</text>
                    <g fill="#0A3254" stroke="#C5A97A" strokeWidth="2">
                        <rect x="50" y="120" width="120" height="60" rx="8" />

                        <text x="510" y="155">Me2: 獨來獨往</text>

                    </g>
                    <g stroke="#007A53" strokeWidth="2" strokeDasharray="4,4" fill="none" markerEnd="url(#arrowGreen)">
                        <line x1="410" y1="220" x2="205" y2="150" />

                        <circle cx="250" cy="230" r="10" />

                        <text x="500" y="210">3. 親密關係替代 (AI伴侶/色情)</text>

                    <rect width="100%" height="100%" fill={bgColor} rx="10"/>

                        <text x="400" y="50">容忍度下降 / 真實互動減少</text>

        const FlipCard = ({ card, addCount, isDark }) => {
            const [flipped, setFlipped] = useState(false);
            
            const handleFlip = () => {
                if (!flipped) addCount();
                setFlipped(!flipped);
            };

            return (
                <div className="relative w-full h-48 cursor-pointer perspective" onClick={handleFlip}>
                    <div className={`flip-card-inner shadow-md ${flipped ? 'flipped' : ''}`}>
                        <div className={`flip-card-front flex flex-col items-center justify-center p-4 text-center border-t-4 border-bcg-navy dark:border-bcg-accent ${isDark ? 'bg-gray-800 text-white' : 'bg-white text-bcg-navy'}`}>

                        </div>
                        <div className={`flip-card-back flex flex-col items-center justify-center p-6 text-center ${isDark ? 'bg-bcg-navy text-gray-200' : 'bg-bcg-navy text-white'}`}>
                            <p className="text-sm leading-relaxed">{card.back}</p>
                        </div>
                    </div>
                </div>
            );
        };

        const ContentModule = ({ data, tabIndex, t, setAnalytics, isDark }) => {
            const [cardIdx, setCardIdx] = useState(0);
            const [quizIdx, setQuizIdx] = useState(0);
            const [quizAns, setQuizAns] = useState(null);

            return (
                <div className="max-w-4xl mx-auto py-8 px-4 animate-fade-in">
                    <h1 className="text-3xl font-bold mb-6 text-bcg-navy dark:text-white border-b-2 border-bcg-accent pb-2">{data.title}</h1>
                    
                    <div className="flex flex-wrap gap-2 mb-6">
                        {data.highlights.map((hl, i) => (
                            <span key={i} className="bg-bcg-gray dark:bg-gray-800 text-bcg-navy dark:text-bcg-accent px-3 py-1 text-sm font-semibold rounded-full border border-gray-200 dark:border-gray-700">
                                <i className="fas fa-check-circle mr-2"></i>{hl}
                            </span>
                        ))}
                    </div>

                    <div className="prose dark:prose-invert max-w-none mb-10 text-lg leading-loose whitespace-pre-line">
                        {data.desc}
                    </div>

                    <div className="w-full h-auto bg-white dark:bg-bcg-darkcard rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-2 mb-10 overflow-hidden">
                        <TopicSVG tabIndex={tabIndex} isDark={isDark} />
                    </div>

                    {data.cards && (
                        <div className="mb-12 bg-gray-50 dark:bg-gray-900/50 p-6 rounded-lg">
                            <h2 className="text-xl font-bold mb-4 flex items-center"><i className="fas fa-clone mr-2 text-bcg-accent"></i> Key Concepts ({cardIdx/2 + 1}/{(data.cards.length/2)})</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                <FlipCard card={data.cards[cardIdx]} isDark={isDark} addCount={() => setAnalytics(p=>({...p, cardsFlipped: p.cardsFlipped+1}))} />
                                {data.cards[cardIdx+1] && <FlipCard card={data.cards[cardIdx+1]} isDark={isDark} addCount={() => setAnalytics(p=>({...p, cardsFlipped: p.cardsFlipped+1}))} />}
                            </div>
                            <div className="flex justify-end gap-2">
                                <button onClick={() => setCardIdx(0)} className="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 transition text-sm font-semibold">{t.ui.retryCard}</button>
                                {(cardIdx + 2) < data.cards.length && (
                                    <button onClick={() => setCardIdx(cardIdx + 2)} className="px-4 py-2 bg-bcg-navy text-white rounded hover:bg-opacity-90 transition text-sm font-semibold">{t.ui.nextCard}</button>
                                )}
                            </div>
                        </div>
                    )}

                    {data.quiz && (
                        <div className="mb-8 border border-gray-200 dark:border-gray-700 rounded-lg p-6">
                            <h2 className="text-xl font-bold mb-4 flex items-center"><i className="fas fa-tasks mr-2 text-bcg-accent"></i> Quiz ({quizIdx+1}/{data.quiz.length})</h2>
                            <div className="mb-4">
                                <p className="font-semibold mb-3">{data.quiz[quizIdx].q}</p>
                                <div className="space-y-2">
                                    {data.quiz[quizIdx].options.map((opt, i) => {
                                        let btnClass = "w-full text-left p-3 rounded border transition font-medium ";
                                        if (quizAns === null) btnClass += "border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800";
                                        else if (i === data.quiz[quizIdx].ans) btnClass += "bg-green-100 border-green-500 text-green-800 dark:bg-green-900/40 dark:text-green-300";
                                        else if (quizAns === i) btnClass += "bg-red-100 border-red-500 text-red-800 dark:bg-red-900/40 dark:text-red-300";
                                        else btnClass += "opacity-40 border-gray-200";

                                        return (
                                            <button key={i} onClick={() => { setQuizAns(i); if(i === data.quiz[quizIdx].ans) setAnalytics(p=>({...p, quizCorrect: p.quizCorrect+1})); }} disabled={quizAns !== null} className={btnClass}>
                                                {String.fromCharCode(65+i)}. {opt}
                                            </button>
                                        );
                                    })}
                                </div>
                                {quizAns !== null && (
                                    <div className={`mt-4 p-3 rounded font-bold flex items-center ${quizAns === data.quiz[quizIdx].ans ? 'bg-green-50 text-green-700 dark:bg-transparent dark:text-green-400' : 'bg-red-50 text-red-700 dark:bg-transparent dark:text-red-400'}`}>
                                        <i className={`fas ${quizAns === data.quiz[quizIdx].ans ? 'fa-check-circle' : 'fa-times-circle'} mr-2 text-lg`}></i>
                                        {quizAns === data.quiz[quizIdx].ans ? t.ui.correct : t.ui.wrong}
                                    </div>
                                )}
                            </div>
                            <div className="flex justify-end gap-2 mt-4">
                                <button onClick={() => {setQuizIdx(0); setQuizAns(null);}} className="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded transition text-sm font-semibold hover:bg-gray-300">{t.ui.retryQuiz}</button>
                                {(quizIdx + 1) < data.quiz.length && (
                                    <button onClick={() => {setQuizIdx(quizIdx + 1); setQuizAns(null);}} className="px-4 py-2 bg-bcg-navy text-white rounded transition text-sm font-semibold hover:bg-opacity-90">{t.ui.nextQuiz}</button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const InteractiveLabsContainer = ({ t }) => {
            const [labTab, setLabTab] = useState(0);

            // Lab 1
            const [xVal, setXVal] = useState(50); const [zVal, setZVal] = useState(50);
            const [simResult, setSimResult] = useState(null);

            // Lab 2
            const pathNodes = ["Y (不性婚育)", "Me1 (數位替代)", "X (科技普及)", "Me2 (獨來獨往)"];
            const correctPath = ["X (科技普及)", "Me1 (數位替代)", "Me2 (獨來獨往)", "Y (不性婚育)"];
            const [userPath, setUserPath] = useState([]);

            // Lab 3
            const scenarios = [
                { text: "覺得經營感情太累，寧願躺平不負責", ans: "Me2" },
                { text: "沉迷於 AI 聊天機器人獲得情緒價值", ans: "Me1" },
                { text: "高速光纖網路與智慧型手機高度覆蓋", ans: "X" },
                { text: "徹底放棄未來結婚生子的規劃", ans: "Y" }
            ];
            const [matched, setMatched] = useState({});

            // Lab 4
            const [methodAns, setMethodAns] = useState(null);

            return (
                <div className="max-w-4xl mx-auto py-8 px-4 animate-fade-in">
                    <h1 className="text-3xl font-bold mb-6 text-bcg-navy dark:text-white border-b-2 border-bcg-accent pb-2">7. Interactive Labs</h1>
                    
                    <div className="flex flex-wrap gap-2 mb-8 bg-gray-200 dark:bg-gray-800 p-1 rounded-lg">
                        {t.ui.labTabs.map((lName, i) => (
                            <button key={i} onClick={()=>setLabTab(i)} className={`flex-1 py-2 text-sm font-bold rounded-md transition ${labTab === i ? 'bg-white dark:bg-bcg-darkcard shadow text-bcg-navy dark:text-bcg-accent' : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'}`}>
                                {lName}
                            </button>
                        ))}
                    </div>

                    <div className="bg-white dark:bg-bcg-darkcard p-6 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 min-h-[400px]">
                        {labTab === 0 && (
                            <div>
                                <h2 className="text-xl font-bold mb-4"><i className="fas fa-sliders-h mr-2 text-bcg-accent"></i>動力模擬器 (Dynamic Simulator)</h2>
                                <p className="mb-6 text-sm text-gray-500">調整「科技暴露度」與「經濟壓力」，觀察對模型終局的理論預測影響。</p>
                                <div className="space-y-6">
                                    <div>
                                        <label className="block mb-2 font-semibold">科技暴露度 (X): {xVal}%</label>
                                        <input type="range" min="0" max="100" value={xVal} onChange={e=>setXVal(e.target.value)} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700"/>
                                    </div>
                                    <div>
                                        <label className="block mb-2 font-semibold">經濟/結構壓力 (Z): {zVal}%</label>
                                        <input type="range" min="0" max="100" value={zVal} onChange={e=>setZVal(e.target.value)} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700"/>
                                    </div>
                                    <button onClick={() => {
                                        const x = xVal/100, z = zVal/100;
                                        setSimResult({
                                            me1: Math.min(100, Math.round((x*0.6 + z*0.4)*100)),
                                            me2: Math.min(100, Math.round(((x*0.6+z*0.4)*0.5 + z*0.5)*100)),
                                            y: Math.min(100, Math.round((((x*0.6+z*0.4)*0.5 + z*0.5)*0.7 + z*0.3)*100))
                                        });
                                    }} className="w-full py-3 bg-bcg-navy text-white font-bold rounded hover:bg-opacity-90">執行運算 (Run Simulation)</button>
                                    
                                    {simResult && (
                                        <div className="mt-6 p-4 bg-gray-50 dark:bg-gray-900 rounded border border-gray-200 dark:border-gray-700">
                                            <div className="space-y-3">
                                                <div><span className="text-sm font-bold">Me1 (數位依賴): {simResult.me1}%</span><div className="w-full bg-gray-200 rounded-full h-2 mt-1"><div className="bg-blue-500 h-2 rounded-full" style={{width: `${simResult.me1}%`}}></div></div></div>
                                                <div><span className="text-sm font-bold">Me2 (退縮/責任移轉): {simResult.me2}%</span><div className="w-full bg-gray-200 rounded-full h-2 mt-1"><div className="bg-purple-500 h-2 rounded-full" style={{width: `${simResult.me2}%`}}></div></div></div>
                                                <div><span className="text-sm font-bold">Y (不性婚育機率): {simResult.y}%</span><div className="w-full bg-gray-200 rounded-full h-2 mt-1"><div className="bg-red-500 h-2 rounded-full" style={{width: `${simResult.y}%`}}></div></div></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {labTab === 1 && (
                            <div>
                                <h2 className="text-xl font-bold mb-4"><i className="fas fa-project-diagram mr-2 text-bcg-accent"></i>因果路徑建構器 (Causal Path Builder)</h2>
                                <p className="mb-6 text-sm text-gray-500">請依序點擊下方節點，建立正確的宏觀因果鏈 (共4步)。</p>
                                <div className="flex gap-2 flex-wrap mb-8">
                                    {pathNodes.filter(n => !userPath.includes(n)).map((node, i) => (
                                        <button key={i} onClick={()=>setUserPath([...userPath, node])} className="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-full font-bold hover:bg-bcg-accent hover:text-white transition">
                                            {node} <i className="fas fa-plus ml-1"></i>
                                        </button>
                                    ))}
                                </div>
                                <div className="flex items-center gap-2 flex-wrap min-h-[60px] p-4 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg">
                                    {userPath.length === 0 && <span className="text-gray-400">路徑區 (請從上方選擇)</span>}
                                    {userPath.map((node, i) => (
                                        <React.Fragment key={i}>
                                            <div className="px-4 py-2 bg-bcg-navy text-white rounded-md font-bold">{node}</div>
                                            {i < userPath.length - 1 && <i className="fas fa-arrow-right text-gray-400"></i>}
                                        </React.Fragment>
                                    ))}
                                </div>
                                <div className="mt-4 flex gap-2">
                                    <button onClick={()=>setUserPath([])} className="px-4 py-2 bg-red-100 text-red-600 rounded font-bold">重置 (Reset)</button>
                                    {userPath.length === 4 && (
                                        <div className={`px-4 py-2 rounded font-bold flex-1 text-center ${JSON.stringify(userPath) === JSON.stringify(correctPath) ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                            {JSON.stringify(userPath) === JSON.stringify(correctPath) ? '建構成功！正確還原核心論述。' : '順序有誤，請回顧單元1與單元2。'}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {labTab === 2 && (
                            <div>
                                <h2 className="text-xl font-bold mb-4"><i className="fas fa-puzzle-piece mr-2 text-bcg-accent"></i>構念情境配對 (Construct Match)</h2>
                                <p className="mb-6 text-sm text-gray-500">判斷以下情境分別屬於哪一個模型變數？</p>
                                <div className="space-y-4">
                                    {scenarios.map((sc, idx) => (
                                        <div key={idx} className="flex flex-col md:flex-row md:items-center justify-between p-3 border rounded dark:border-gray-600 bg-gray-50 dark:bg-gray-800">
                                            <div className="font-medium mb-2 md:mb-0">{sc.text}</div>
                                            <div className="flex gap-2">
                                                {["X", "Me1", "Me2", "Y"].map(v => (
                                                    <button key={v} onClick={() => setMatched({...matched, [idx]: v})}
                                                        className={`px-3 py-1 rounded border text-sm font-bold ${matched[idx] === v ? (matched[idx] === sc.ans ? 'bg-green-500 text-white border-green-500' : 'bg-red-500 text-white border-red-500') : 'bg-white text-gray-600 dark:bg-gray-700 dark:text-gray-200'}`}>
                                                        {v}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {labTab === 3 && (
                            <div>
                                <h2 className="text-xl font-bold mb-4"><i className="fas fa-code-branch mr-2 text-bcg-accent"></i>實證方法決策樹 (Method Decision)</h2>
                                <p className="mb-6 text-sm text-gray-500">情境：您獲得了一筆連續三年追蹤東亞青年行為的數據，希望能驗證「數位替代」與「社會退縮」之間是單向影響還是『惡性循環(互相影響)』。您應該選擇哪種高階統計模型？</p>
                                <div className="space-y-3">
                                    {[
                                        { name: "一般多元迴歸 (Multiple Regression)", correct: false, msg: "無法處理隨時間變化的雙向因果關係。" },
                                        { name: "交叉延遲模型 (RI-CLPM)", correct: true, msg: "正確！RI-CLPM 能分離組間差異與組內動態，是驗證迴饋迴路 (Feedback Loop) 的黃金標準。" },
                                        { name: "多群組分析 (Multi-group SEM)", correct: false, msg: "這是用來驗證調節變數 (Z) 在不同群體間差異的方法，非針對時間迴路。" }
                                    ].map((opt, i) => (
                                        <div key={i}>
                                            <button onClick={()=>setMethodAns(i)} className={`w-full text-left p-3 border rounded font-bold transition ${methodAns === i ? (opt.correct ? 'bg-green-100 border-green-500 dark:bg-green-900/40 text-green-700 dark:text-green-300' : 'bg-red-100 border-red-500 dark:bg-red-900/40 text-red-700 dark:text-red-300') : 'hover:bg-gray-100 dark:hover:bg-gray-700 border-gray-300 dark:border-gray-600'}`}>
                                                {opt.name}
                                            </button>
                                            {methodAns === i && <div className={`text-sm mt-1 ml-2 ${opt.correct ? 'text-green-600' : 'text-red-500'}`}>{opt.msg}</div>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AnalyticsPage = ({ t, analytics, userInfo, setUserInfo, handleExport }) => (
            <div className="max-w-4xl mx-auto py-8 px-4 animate-fade-in">
                <h1 className="text-3xl font-bold mb-6 text-bcg-navy dark:text-white border-b-2 border-bcg-accent pb-2">{t.nav[9]}</h1>
                
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    {t.ui.stats.map((lbl, i) => {
                        const vals = [analytics.timeSpent.reduce((a,b)=>a+b,0), analytics.clicks, analytics.cardsFlipped, analytics.quizCorrect];
                        return (
                            <div key={i} className="bg-white dark:bg-bcg-darkcard p-4 rounded-lg shadow text-center border-t-4 border-bcg-navy dark:border-bcg-accent">
                                <div className="text-sm text-gray-500 dark:text-gray-400 mb-2">{lbl}</div>
                                <div className="text-3xl font-bold text-bcg-navy dark:text-white">{vals[i]}</div>
                            </div>
                        );
                    })}
                </div>

                <div className="bg-white dark:bg-bcg-darkcard p-6 rounded-lg shadow-md border border-gray-200 dark:border-gray-700">
                    <h2 className="text-xl font-bold mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">資料匯出設定 (Export Data)</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <input type="text" placeholder={t.ui.group + " (例: G1)"} className="p-3 border rounded dark:bg-gray-800 dark:border-gray-600 focus:outline-none focus:border-bcg-accent" value={userInfo.group} onChange={e=>setUserInfo({...userInfo, group: e.target.value})}/>
                        <input type="text" placeholder={t.ui.studentId + " (例: 113212599)"} className="p-3 border rounded dark:bg-gray-800 dark:border-gray-600 focus:outline-none focus:border-bcg-accent" value={userInfo.studentId} onChange={e=>setUserInfo({...userInfo, studentId: e.target.value})}/>
                        <input type="text" placeholder={t.ui.name + " (例: Shihmin Lo)"} className="p-3 border rounded dark:bg-gray-800 dark:border-gray-600 focus:outline-none focus:border-bcg-accent" value={userInfo.name} onChange={e=>setUserInfo({...userInfo, name: e.target.value})}/>
                    </div>
                    <div className="flex flex-col md:flex-row gap-4">
                        <button onClick={handleExport} className="flex-1 bg-bcg-navy text-white py-3 rounded hover:bg-opacity-90 transition font-bold shadow-md"><i className="fas fa-file-csv mr-2"></i>{t.ui.export}</button>
                        <button onClick={() => {if(confirm('確定刷新所有學習記錄？ / Are you sure to clear records?')) window.location.reload();}} className="px-6 bg-red-600 text-white py-3 rounded hover:bg-red-700 transition font-bold shadow-md"><i className="fas fa-trash-alt mr-2"></i>{t.ui.clear}</button>
                    </div>
                </div>
            </div>
        );

        // --- 主應用入口 ---
        const App = () => {
            const [lang, setLang] = useState('tw');
            const [isDark, setIsDark] = useState(true);
            const [activeTab, setActiveTab] = useState(0);
            const [menuOpen, setMenuOpen] = useState(false);
            
            const [analytics, setAnalytics] = useState({ timeSpent: Array(10).fill(0), clicks: 0, cardsFlipped: 0, quizCorrect: 0 });
            const [userInfo, setUserInfo] = useState({ group: '', studentId: '', name: '' });

            // TTS State
            const [isSpeaking, setIsSpeaking] = useState(false);
            const speechSynth = window.speechSynthesis;

            const t = dict[lang];

            // Theme Effect
            useEffect(() => {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDark]);

            // Analytics Timers
            useEffect(() => {
                const timer = setInterval(() => {
                    setAnalytics(prev => {
                        const newTime = [...prev.timeSpent];
                        newTime[activeTab] += 1;
                        return { ...prev, timeSpent: newTime };
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [activeTab]);

            useEffect(() => {
                const handleClick = () => setAnalytics(prev => ({ ...prev, clicks: prev.clicks + 1 }));
                window.addEventListener('click', handleClick);
                return () => window.removeEventListener('click', handleClick);
            }, []);

            // --- TTS Functionality ---
            const handleTTSPlay = () => {
                speechSynth.cancel(); // Stop current
                let textToRead = "";

                if (activeTab >= 0 && activeTab <= 6) {
                    const d = t.content[activeTab];
                    textToRead += `${d.title}. \n\n`;
                    textToRead += d.highlights.join(". ") + ". \n\n";
                    textToRead += `${d.desc} \n\n`;
                    if (d.cards) {
                        d.cards.forEach(c => { textToRead += `${c.front}. ${c.back}. \n`; });
                    }
                } else if (activeTab === 7) {
                    textToRead = "Interactive Labs. " + t.ui.labTabs.join(". ") + ". Please select a lab to interact.";
                } else {
                    textToRead = t.nav[activeTab];
                }

                const utterance = new SpeechSynthesisUtterance(textToRead);
                
                // Voice matching logic
                const voices = speechSynth.getVoices();
                if (lang === 'tw') {
                    utterance.lang = 'zh-TW';
                    // Try to find Yating or Taiwan
                    const twVoice = voices.find(v => v.name.includes('Yating') || v.name.includes('Taiwan')) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.includes('zh'));
                    if (twVoice) utterance.voice = twVoice;
                } else {
                    utterance.lang = 'en-GB';
                    // Try to find UK/British Male
                    const enVoice = voices.find(v => (v.name.includes('UK') || v.name.includes('British')) && v.name.includes('Male')) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.includes('en'));
                    if (enVoice) utterance.voice = enVoice;
                }

                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);

                speechSynth.speak(utterance);
                setIsSpeaking(true);
            };

            const handleTTSPause = () => {
                if (speechSynth.speaking) {
                    if (speechSynth.paused) speechSynth.resume();
                    else speechSynth.pause();
                }
            };

            const handleTTSStop = () => {
                speechSynth.cancel();
                setIsSpeaking(false);
            };
            
            // Stop TTS when tab or language changes
            useEffect(() => {
                handleTTSStop();
            }, [activeTab, lang]);

            const handleExport = () => {
                let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                csvContent += "Group,Student ID,Name,Date,Total Clicks,Cards Flipped,Quiz Correct\n";
                const date = new Date().toISOString().split('T')[0];
                csvContent += `${userInfo.group},${userInfo.studentId},${userInfo.name},${date},${analytics.clicks},${analytics.cardsFlipped},${analytics.quizCorrect}\n\n`;
                csvContent += "Module,Time Spent (Seconds)\n";
                t.nav.forEach((navName, idx) => { csvContent += `${navName},${analytics.timeSpent[idx]}\n`; });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `SPA_${userInfo.group}_${userInfo.name}_${date}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <>
                    <header className="bg-white dark:bg-bcg-darkcard shadow-md sticky top-0 z-40 h-16 flex items-center justify-between px-4 lg:px-8 border-b border-gray-200 dark:border-gray-800 transition-colors">
                        <div className="flex items-center gap-4">
                            <div className="relative z-50">
                                <button onClick={() => setMenuOpen(!menuOpen)} className="text-2xl p-2 hover:text-bcg-accent transition">
                                    <i className="fas fa-bars"></i>
                                </button>
                                {menuOpen && (
                                    <div className="absolute top-12 left-0 w-72 bg-white dark:bg-bcg-darkcard border border-gray-200 dark:border-gray-700 shadow-2xl rounded-md overflow-hidden">
                                        {t.nav.map((item, idx) => (
                                            <button key={idx} 
                                                onClick={() => { setActiveTab(idx); setMenuOpen(false); window.scrollTo({top:0, behavior:'smooth'}); }}
                                                className={`w-full text-left px-4 py-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition text-sm ${activeTab === idx ? 'bg-bcg-gray text-bcg-navy dark:bg-gray-900 dark:text-bcg-accent font-bold border-l-4 border-l-bcg-accent' : ''}`}>
                                                {item}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <h1 className="font-bold text-lg md:text-xl text-bcg-navy dark:text-white cursor-pointer truncate hidden sm:block" onClick={() => window.scrollTo({top:0, behavior:'smooth'})}>
                                <i className="fas fa-project-diagram mr-2 text-bcg-accent"></i>{t.brand}
                            </h1>
                        </div>
                        <div className="flex items-center gap-2 md:gap-4 text-sm">
                            {/* TTS Controls */}
                            <div className="flex items-center gap-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-full border border-gray-200 dark:border-gray-700">
                                <button onClick={handleTTSPlay} className={`w-8 h-8 rounded-full flex items-center justify-center transition ${isSpeaking ? 'bg-green-100 dark:bg-green-900 text-green-600' : 'hover:bg-white dark:hover:bg-gray-600 text-green-600 dark:text-green-400'}`} title={t.ui.play}><i className="fas fa-play"></i></button>
                                <button onClick={handleTTSPause} className="w-8 h-8 rounded-full hover:bg-white dark:hover:bg-gray-600 flex items-center justify-center transition text-yellow-600 dark:text-yellow-400" title={t.ui.pause}><i className="fas fa-pause"></i></button>
                                <button onClick={handleTTSStop} className="w-8 h-8 rounded-full hover:bg-white dark:hover:bg-gray-600 flex items-center justify-center transition text-red-600 dark:text-red-400" title={t.ui.stop}><i className="fas fa-stop"></i></button>
                            </div>

                            {/* Language Toggle */}
                            <button onClick={() => setLang(lang === 'tw' ? 'en' : 'tw')} className="font-bold px-3 py-1.5 bg-bcg-navy text-white rounded hover:bg-opacity-80 transition shadow-sm border border-transparent">
                                {lang === 'tw' ? 'EN' : 'TW'}
                            </button>

                            {/* Theme Toggle */}
                            <button onClick={() => setIsDark(!isDark)} className="text-xl hover:scale-110 transition ml-2" title={isDark ? t.ui.themeDark : t.ui.themeLight}>
                                {isDark ? <i className="fas fa-sun text-yellow-400"></i> : <i className="fas fa-moon text-gray-600"></i>}
                            </button>
                        </div>
                    </header>

                    <main className="flex-grow pb-24">
                        {activeTab >= 0 && activeTab <= 6 && <ContentModule data={t.content[activeTab]} tabIndex={activeTab} t={t} setAnalytics={setAnalytics} isDark={isDark} />}
                        {activeTab === 7 && <InteractiveLabsContainer t={t} />}
                        {activeTab === 8 && <div className="max-w-4xl mx-auto py-20 text-center text-xl text-gray-500 font-bold"><i className="fas fa-link mr-2"></i>外部學習資源 (建置中) / External Resources</div>}
                        {activeTab === 9 && <AnalyticsPage t={t} analytics={analytics} userInfo={userInfo} setUserInfo={setUserInfo} handleExport={handleExport} />}
                        
                        <div className="max-w-4xl mx-auto px-4 flex justify-between mt-8 pt-6 border-t border-gray-200 dark:border-gray-800">
                            <button onClick={() => { if(activeTab > 0) { setActiveTab(activeTab - 1); window.scrollTo(0,0); } }} 
                                    className={`px-4 py-2 flex items-center ${activeTab === 0 ? 'invisible' : 'text-bcg-navy dark:text-bcg-accent hover:underline font-bold'}`}>
                                <i className="fas fa-chevron-left mr-2"></i> {t.ui.prev}
                            </button>
                            <button onClick={() => { if(activeTab < 9) { setActiveTab(activeTab + 1); window.scrollTo(0,0); } }} 
                                    className={`px-4 py-2 flex items-center ${activeTab === 9 ? 'invisible' : 'text-bcg-navy dark:text-bcg-accent hover:underline font-bold'}`}>
                                {t.ui.next} <i className="fas fa-chevron-right ml-2"></i>
                            </button>
                        </div>
                    </main>

                    <footer className="bg-white dark:bg-bcg-darkcard border-t border-gray-200 dark:border-gray-800 h-10 flex items-center justify-between px-4 lg:px-8 text-xs text-gray-500 dark:text-gray-400 fixed bottom-0 w-full z-40 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                        <div>Ver 2026.04 | &copy; 2026 All Rights Reserved.</div>
                        <div className="flex items-center gap-4">
                            <span>Architect: <a href="https://www.ibs.ncnu.edu.tw/index.php/faculty/tenured-professor/299-smlo" target="_blank" className="text-bcg-navy dark:text-bcg-accent hover:underline font-bold">Prof. Shihmin Lo</a></span>
                            <button onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})} className="hover:text-bcg-navy dark:hover:text-white transition font-bold"><i className="fas fa-arrow-up mr-1"></i>Top</button>
                        </div>
                    </footer>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
