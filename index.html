                        title: "5. 結構性催化劑 (Z)",

        // --- 主程式 ---
        const App = () => {
            const [lang, setLang] = useState('tw');
            const [isDark, setIsDark] = useState(true);
            const [activeTab, setActiveTab] = useState(0);
            const [menuOpen, setMenuOpen] = useState(false);
            const [ttsSpeaking, setTtsSpeaking] = useState(false);
            
            // 學習歷程分析 State
            const [analytics, setAnalytics] = useState({
                timeSpent: Array(10).fill(0),
                clicks: 0,
                cardsFlipped: 0,
                quizCorrect: 0
            });
            const [userInfo, setUserInfo] = useState({ group: '', studentId: '', name: '' });

            const t = dict[lang];

            // Toggle Theme
            useEffect(() => {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDark]);

            // Timer Tracker
            useEffect(() => {
                const timer = setInterval(() => {
                    setAnalytics(prev => {
                        const newTime = [...prev.timeSpent];
                        newTime[activeTab] += 1;
                        return { ...prev, timeSpent: newTime };
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [activeTab]);

            // Global Click Tracker
            useEffect(() => {
                const handleClick = () => setAnalytics(prev => ({ ...prev, clicks: prev.clicks + 1 }));
                window.addEventListener('click', handleClick);
                return () => window.removeEventListener('click', handleClick);
            }, []);

            // TTS Function
            const speak = (action) => {
                window.speechSynthesis.cancel();
                setTtsSpeaking(false);
                if (action === 'play') {
                    const utterance = new SpeechSynthesisUtterance();
                    let textToRead = "";
                    if (activeTab === 0) textToRead = t.content[0].title + ". " + t.content[0].desc;
                    else if (activeTab >= 1 && activeTab <= 6) textToRead = t.content[activeTab].title + ". " + t.content[activeTab].desc;
                    else if (activeTab === 7) textToRead = t.lab.title + ". " + t.lab.simDesc;
                    else textToRead = t.nav[activeTab];

                    utterance.text = textToRead;
                    // Try to set voice based on language
                    const voices = window.speechSynthesis.getVoices();
                    if (lang === 'tw') {
                        utterance.lang = 'zh-TW';
                        const twVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-HK'));
                        if (twVoice) utterance.voice = twVoice;
                    } else {
                        utterance.lang = 'en-GB';
                        const enVoice = voices.find(v => v.lang.includes('en-GB') && v.name.includes('Male'));
                        if (enVoice) utterance.voice = enVoice;
                    }
                    
                    utterance.onend = () => setTtsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                    setTtsSpeaking(true);
                } else if (action === 'pause') {
                    window.speechSynthesis.pause();
                }
            };

            // Download CSV
            const handleExport = () => {
                let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                csvContent += "Group,Student ID,Name,Date,Total Clicks,Cards Flipped,Quiz Correct\n";
                const date = new Date().toISOString().split('T')[0];
                csvContent += `${userInfo.group},${userInfo.studentId},${userInfo.name},${date},${analytics.clicks},${analytics.cardsFlipped},${analytics.quizCorrect}\n\n`;
                
                csvContent += "Module,Time Spent (Seconds)\n";
                t.nav.forEach((navName, idx) => {
                    csvContent += `${navName},${analytics.timeSpent[idx]}\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `SPA_${userInfo.group}_${userInfo.name}_${date}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Components
            const NavMenu = () => (
                <div className="relative z-50">
                    <button onClick={() => setMenuOpen(!menuOpen)} className="text-2xl p-2 hover:text-bcg-accent transition">
                        <i className="fas fa-bars"></i>
                    </button>
                    {menuOpen && (
                        <div className="absolute top-12 left-0 w-64 bg-white dark:bg-bcg-darkcard border border-gray-200 dark:border-gray-700 shadow-xl rounded-md overflow-hidden">
                            {t.nav.map((item, idx) => (
                                <button key={idx} 
                                    onClick={() => { setActiveTab(idx); setMenuOpen(false); window.scrollTo(0,0); }}
                                    className={`w-full text-left px-4 py-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 transition ${activeTab === idx ? 'bg-bcg-gray text-bcg-navy dark:bg-gray-800 dark:text-white font-bold' : ''}`}>
                                    {item}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );

            // Flip Card Component
            const FlipCard = ({ card }) => {
                const [flipped, setFlipped] = useState(false);
                return (
                    <div className="relative w-full h-48 perspective-1000 cursor-pointer" 
                         onClick={() => { setFlipped(!flipped); if(!flipped) setAnalytics(prev => ({...prev, cardsFlipped: prev.cardsFlipped + 1})) }}>
                        <div className={`w-full h-full absolute transform-style-3d transition-transform-700 ${flipped ? 'rotate-y-180' : ''}`}>
                            {/* Front */}
                            <div className="absolute w-full h-full backface-hidden bg-white dark:bg-bcg-darkcard border-t-4 border-bcg-navy dark:border-bcg-accent shadow-md flex items-center justify-center p-4 text-center rounded-b-md">
                                <h3 className="font-bold text-lg text-bcg-navy dark:text-white">{card.front}</h3>
                                <div className="absolute bottom-2 text-xs text-gray-400"><i className="fas fa-sync-alt mr-1"></i>{t.ui.flip}</div>
                            </div>
                            {/* Back */}
                            <div className="absolute w-full h-full backface-hidden rotate-y-180 bg-bcg-navy dark:bg-gray-800 text-white shadow-md flex items-center justify-center p-6 text-center rounded-md">
                                <p className="text-sm leading-relaxed">{card.back}</p>
                            </div>
                        </div>
                    </div>
                );
            };

            const ContentModule = ({ data, tabIndex }) => {
                const [cardIdx, setCardIdx] = useState(0);
                const [quizIdx, setQuizIdx] = useState(0);
                const [quizAns, setQuizAns] = useState(null);

                return (
                    <div className="max-w-4xl mx-auto py-8 px-4 animate-fade-in">
                        <h1 className="text-3xl font-bold mb-6 text-bcg-navy dark:text-white border-b-2 border-bcg-accent pb-2">{data.title}</h1>
                        
                        {/* Highlights */}
                        <div className="flex flex-wrap gap-2 mb-6">
                            {data.highlights.map((hl, i) => (
                                <span key={i} className="bg-bcg-gray dark:bg-gray-800 text-bcg-navy dark:text-bcg-accent px-3 py-1 text-sm font-semibold rounded-full border border-gray-200 dark:border-gray-700">
                                    <i className="fas fa-check-circle mr-2"></i>{hl}
                                </span>
                            ))}
                        </div>

                        {/* Description */}
                        <div className="prose dark:prose-invert max-w-none mb-10 text-lg leading-loose whitespace-pre-line">
                            {data.desc}
                        </div>

                        {/* Image Placeholder */}
                        <div className="w-full h-48 bg-gray-200 dark:bg-gray-800 rounded-lg flex items-center justify-center mb-10 border border-dashed border-gray-400">
                            <span className="text-gray-500 dark:text-gray-400"><i className="far fa-image mr-2"></i></span>
                        </div>

                        {/* Flip Cards Section */}
                        {data.cards && (
                            <div className="mb-12 bg-gray-50 dark:bg-gray-900/50 p-6 rounded-lg">
                                <h2 className="text-xl font-bold mb-4 flex items-center"><i className="fas fa-clone mr-2 text-bcg-accent"></i> Key Concepts ({cardIdx/2 + 1}/{(data.cards.length/2)})</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                                    <FlipCard card={data.cards[cardIdx]} />
                                    {data.cards[cardIdx+1] && <FlipCard card={data.cards[cardIdx+1]} />}
                                </div>
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setCardIdx(0)} className="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600 transition text-sm">{t.ui.retryCard}</button>
                                    {(cardIdx + 2) < data.cards.length && (
                                        <button onClick={() => setCardIdx(cardIdx + 2)} className="px-4 py-2 bg-bcg-navy text-white rounded hover:bg-opacity-90 transition text-sm">{t.ui.nextCard}</button>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Quiz Section */}
                        {data.quiz && (
                            <div className="mb-8 border border-gray-200 dark:border-gray-700 rounded-lg p-6">
                                <h2 className="text-xl font-bold mb-4 flex items-center"><i className="fas fa-tasks mr-2 text-bcg-accent"></i> Knowledge Check</h2>
                                <div className="mb-4">
                                    <p className="font-semibold mb-3">{data.quiz[quizIdx].q}</p>
                                    <div className="space-y-2">
                                        {data.quiz[quizIdx].options.map((opt, i) => (
                                            <button key={i} 
                                                onClick={() => {
                                                    setQuizAns(i);
                                                    if(i === data.quiz[quizIdx].ans) setAnalytics(prev => ({...prev, quizCorrect: prev.quizCorrect + 1}));
                                                }}
                                                disabled={quizAns !== null}
                                                className={`w-full text-left p-3 rounded border transition ${
                                                    quizAns === null ? 'border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800' :
                                                    i === data.quiz[quizIdx].ans ? 'bg-green-100 border-green-500 text-green-800 dark:bg-green-900/30 dark:text-green-400' :
                                                    quizAns === i ? 'bg-red-100 border-red-500 text-red-800 dark:bg-red-900/30 dark:text-red-400' : 'opacity-50'
                                                }`}>
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                    {quizAns !== null && (
                                        <div className={`mt-4 p-3 rounded font-bold ${quizAns === data.quiz[quizIdx].ans ? 'text-green-600' : 'text-red-500'}`}>
                                            {quizAns === data.quiz[quizIdx].ans ? t.ui.correct : t.ui.wrong}
                                        </div>
                                    )}
                                </div>
                                <div className="flex justify-end gap-2 mt-4">
                                    <button onClick={() => {setQuizIdx(0); setQuizAns(null);}} className="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600 transition text-sm">{t.ui.retryQuiz}</button>
                                    {(quizIdx + 1) < data.quiz.length && (
                                        <button onClick={() => {setQuizIdx(quizIdx + 1); setQuizAns(null);}} className="px-4 py-2 bg-bcg-navy text-white rounded hover:bg-opacity-90 transition text-sm">{t.ui.nextQuiz}</button>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const InteractiveLab = () => {
                const [xVal, setXVal] = useState(50);
                const [zVal, setZVal] = useState(50);
                const [simResult, setSimResult] = useState(null);

                const runSim = () => {
                    const x = xVal / 100; const z = zVal / 100;
                    // Mock calculation based on conceptual model
                    const me1 = Math.min(100, Math.round((x * 0.6 + z * x * 0.4) * 100));
                    const me2 = Math.min(100, Math.round((me1 * 0.5 + z * me1 * 0.5) * 100));
                    const y = Math.min(100, Math.round((me2 * 0.7 + z * 0.3) * 100));
                    setSimResult({ me1, me2, y });
                };

                return (
                    <div className="max-w-4xl mx-auto py-8 px-4">
                        <h1 className="text-3xl font-bold mb-6 text-bcg-navy dark:text-white border-b-2 border-bcg-accent pb-2">{t.lab.title}</h1>
                        <p className="mb-8 text-lg">{t.lab.simDesc}</p>
                        
                        <div className="bg-white dark:bg-bcg-darkcard p-6 rounded-lg shadow-md border border-gray-200 dark:border-gray-700">
                            <h2 className="text-xl font-bold mb-6"><i className="fas fa-sliders-h mr-2 text-bcg-accent"></i>{t.lab.simTitle}</h2>
                            
                            <div className="mb-6">
                                <label className="block mb-2 font-semibold">{t.lab.xLabel}: {xVal}%</label>
                                <input type="range" min="0" max="100" value={xVal} onChange={e => setXVal(e.target.value)} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700"/>
                            </div>
                            
                            <div className="mb-8">
                                <label className="block mb-2 font-semibold">{t.lab.zLabel}: {zVal}%</label>
                                <input type="range" min="0" max="100" value={zVal} onChange={e => setZVal(e.target.value)} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700"/>
                            </div>

                            <button onClick={runSim} className="w-full py-3 bg-bcg-green text-white font-bold rounded hover:bg-opacity-90 transition">
                                {t.lab.btnSimulate}
                            </button>

                            {simResult && (
                                <div className="mt-8 p-6 bg-gray-50 dark:bg-gray-900 rounded border border-gray-200 dark:border-gray-600">
                                    <h3 className="font-bold text-lg mb-4 text-center">{t.lab.resultTitle}</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <div className="flex justify-between mb-1 text-sm font-semibold"><span>{t.lab.resMe1}</span><span>{simResult.me1}%</span></div>
                                            <div className="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700"><div className="bg-blue-600 h-2.5 rounded-full" style={{width: `${simResult.me1}%`}}></div></div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between mb-1 text-sm font-semibold"><span>{t.lab.resMe2}</span><span>{simResult.me2}%</span></div>
                                            <div className="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700"><div className="bg-purple-600 h-2.5 rounded-full" style={{width: `${simResult.me2}%`}}></div></div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between mb-1 text-sm font-semibold"><span>{t.lab.resY}</span><span>{simResult.y}%</span></div>
                                            <div className="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700"><div className="bg-red-600 h-2.5 rounded-full" style={{width: `${simResult.y}%`}}></div></div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const AnalyticsPage = () => (
                <div className="max-w-4xl mx-auto py-8 px-4">
                    <h1 className="text-3xl font-bold mb-6 text-bcg-navy dark:text-white border-b-2 border-bcg-accent pb-2">{t.nav[9]}</h1>
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        {t.ui.stats.map((lbl, i) => {
                            const vals = [analytics.timeSpent.reduce((a,b)=>a+b,0), analytics.clicks, analytics.cardsFlipped, analytics.quizCorrect];
                            return (
                                <div key={i} className="bg-white dark:bg-bcg-darkcard p-4 rounded-lg shadow text-center border-t-4 border-bcg-navy dark:border-bcg-accent">
                                    <div className="text-sm text-gray-500 dark:text-gray-400 mb-1">{lbl}</div>
                                    <div className="text-2xl font-bold text-bcg-navy dark:text-white">{vals[i]}</div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="bg-white dark:bg-bcg-darkcard p-6 rounded-lg shadow-md border border-gray-200 dark:border-gray-700">
                        <h2 className="text-xl font-bold mb-4">Export Settings</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <input type="text" placeholder={t.ui.group + " (e.g., G1)"} className="p-2 border rounded dark:bg-gray-800 dark:border-gray-600" value={userInfo.group} onChange={e=>setUserInfo({...userInfo, group: e.target.value})}/>
                            <input type="text" placeholder={t.ui.studentId + " (e.g., 113212599)"} className="p-2 border rounded dark:bg-gray-800 dark:border-gray-600" value={userInfo.studentId} onChange={e=>setUserInfo({...userInfo, studentId: e.target.value})}/>
                            <input type="text" placeholder={t.ui.name + " (e.g., Shihmin Lo)"} className="p-2 border rounded dark:bg-gray-800 dark:border-gray-600" value={userInfo.name} onChange={e=>setUserInfo({...userInfo, name: e.target.value})}/>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={handleExport} className="flex-1 bg-bcg-navy text-white py-2 rounded hover:bg-opacity-90 transition font-bold"><i className="fas fa-download mr-2"></i>{t.ui.export}</button>
                            <button onClick={() => window.location.reload()} className="px-6 bg-red-600 text-white py-2 rounded hover:bg-red-700 transition"><i className="fas fa-trash-alt mr-2"></i>{t.ui.clear}</button>
                        </div>
                    </div>
                </div>
            );

            // Main Render Logic
            const renderContent = () => {
                if (activeTab >= 0 && activeTab <= 6) return <ContentModule data={t.content[activeTab]} tabIndex={activeTab} />;
                if (activeTab === 7) return <InteractiveLab />;
                if (activeTab === 8) return <div className="max-w-4xl mx-auto py-8 text-center text-xl mt-20">{t.nav[8]} - Content Pending</div>;
                if (activeTab === 9) return <AnalyticsPage />;
            };

            return (
                <>
                    {/* Header */}
                    <header className="bg-white dark:bg-bcg-darkcard shadow-md sticky top-0 z-40 h-16 flex items-center justify-between px-4 lg:px-8 border-b border-gray-200 dark:border-gray-800 transition-colors">
                        <div className="flex items-center gap-4">
                            <NavMenu />
                            <h1 className="font-bold text-lg md:text-xl text-bcg-navy dark:text-white cursor-pointer truncate" onClick={() => window.scrollTo(0,0)}>
                                <i className="fas fa-project-diagram mr-2 text-bcg-accent"></i>{t.brand}
                            </h1>
                        </div>
                        <div className="flex items-center gap-3 md:gap-6 text-sm">
                            <div className="hidden md:flex items-center gap-2 bg-gray-100 dark:bg-gray-800 p-1 rounded-full">
                                <button onClick={() => speak('play')} className="w-8 h-8 rounded-full hover:bg-white dark:hover:bg-gray-600 flex items-center justify-center transition" title={t.ui.play}><i className="fas fa-play text-green-600 dark:text-green-400"></i></button>
                                <button onClick={() => speak('pause')} className="w-8 h-8 rounded-full hover:bg-white dark:hover:bg-gray-600 flex items-center justify-center transition" title={t.ui.pause}><i className="fas fa-pause text-yellow-600 dark:text-yellow-400"></i></button>
                                <button onClick={() => speak('stop')} className="w-8 h-8 rounded-full hover:bg-white dark:hover:bg-gray-600 flex items-center justify-center transition" title={t.ui.stop}><i className="fas fa-stop text-red-600 dark:text-red-400"></i></button>
                            </div>
                            <button onClick={() => setLang(lang === 'tw' ? 'en' : 'tw')} className="font-bold px-3 py-1 bg-bcg-navy text-white rounded hover:bg-opacity-80 transition">{t.ui.lang}</button>
                            <button onClick={() => setIsDark(!isDark)} className="text-xl" title={isDark ? t.ui.themeDark : t.ui.themeLight}>
                                {isDark ? <i className="fas fa-sun text-yellow-400"></i> : <i className="fas fa-moon text-gray-600"></i>}
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-grow pb-24">
                        {renderContent()}
                        
                        {/* Pagination Buttons */}
                        <div className="max-w-4xl mx-auto px-4 flex justify-between mt-8 border-t border-gray-200 dark:border-gray-700 pt-6">
                            <button onClick={() => { if(activeTab > 0) { setActiveTab(activeTab - 1); window.scrollTo(0,0); } }} 
                                    className={`px-4 py-2 flex items-center ${activeTab === 0 ? 'invisible' : 'text-bcg-navy dark:text-bcg-accent hover:underline font-bold'}`}>
                                <i className="fas fa-chevron-left mr-2"></i> {t.ui.prev}
                            </button>
                            <button onClick={() => { if(activeTab < 9) { setActiveTab(activeTab + 1); window.scrollTo(0,0); } }} 
                                    className={`px-4 py-2 flex items-center ${activeTab === 9 ? 'invisible' : 'text-bcg-navy dark:text-bcg-accent hover:underline font-bold'}`}>
                                {t.ui.next} <i className="fas fa-chevron-right ml-2"></i>
                            </button>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="bg-white dark:bg-bcg-darkcard border-t border-gray-200 dark:border-gray-800 h-8 flex items-center justify-between px-4 lg:px-8 text-xs text-gray-500 dark:text-gray-400 fixed bottom-0 w-full z-40">
                        <div>Version 2026.04 | &copy; 2026 All Rights Reserved.</div>
                        <div className="flex items-center gap-4">
                            <span>Architect: <a href="https://www.ibs.ncnu.edu.tw/index.php/faculty/tenured-professor/299-smlo" target="_blank" className="text-bcg-navy dark:text-bcg-accent hover:underline font-bold">Prof. Shihmin Lo</a></span>
                            <button onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})} className="hover:text-bcg-navy dark:hover:text-white transition"><i className="fas fa-arrow-up mr-1"></i>Top</button>
                        </div>
                    </footer>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
