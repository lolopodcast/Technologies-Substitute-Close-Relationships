                        desc: "本互動學習模組旨在解構「科技普及(X)」如何透過「數位替代(Me1)」與「獨來獨往傾向(Me2)」，最終導致「不性婚育(Y)」的總體人口現象。\n\n在東亞高度發展的國家（如台灣、日本、韓國），生育率與結婚率的崩塌長期以來多被單一地歸咎於經濟壓力。然而，本提案具備強烈的跨領域理論整合企圖心，試圖將總體 (Macro) 的人口崩塌現象，更精緻地連結至微觀的心理行為機制。結合「使用與滿足理論」與「社會退縮」的相關文獻，學習者將透過本系統，逐步釐清構念邊界，深入探討從基礎的娛樂互動、情感支持，一路到最深層的親密關係的全面數位替代過程。\n\n此外，我們將檢視「責任移轉」這一核心創新概念，了解當代青年如何將「不進入實體關係」的狀態進行積極的認知合理化，視其為一種主動的「減壓選擇」，而非單純交際能力的匱乏。本模組亦涵蓋結構強化變數（如經濟壓力、性別結構等多個構面）的調節作用，探討社會環境如何催化科技的孤立效應，並最終討論如何透過結構方程式 (SEM) 等高階量化技術進行嚴謹的實證檢驗。請點擊下方單元開始探索。",

                            { q: "數位替代相對於實體關係的核心優勢是什麼？", options: ["高昂的硬體使用成本", "極低的邊際成本與完全免除現實摩擦的報償", "需要高強度的體力與腦力勞動", "增加與家族長輩的實體互動"], ans: 1 },

                        ]

                    {

                    {

                        desc: "人類的社會行為從來都不是單向的線性發展。為了更貼近真實現象，本模型提出了一個極具破壞力的動態「回饋迴路 (Feedback Loop)」：當個體發展出 Me2（獨來獨往、社會退縮與減少真實互動）之後，為了填補人類天生不可抹滅的人際與情感空缺，他們別無選擇，只能進一步提升對 Me1（數位替代功能）的依賴。\n\n這種自我強化的惡性循環（Me2 ↺ Me1）導致個體更深地陷入數位封閉系統中，猶如被困在演算法精心打造的資訊繭房裡。在長期缺乏真實人際演練的情況下，個體處理複雜社交線索的能力急遽衰退，「真實互動的肌肉」逐漸萎縮。這直接導致他們在面對實體關係中無可避免的摩擦、意見衝突與不可控性時，心理容忍度降至冰點，進而引發下一波更嚴重的退縮行為。\n\n在實證設計上，要精確捕捉此一動態且互相強化的過程，單一次的橫斷面資料 (Cross-sectional data) 是絕對不足的，因為它無法釐清究竟是誰先誰後的因果方向。研究者必須仰賴長期的縱貫性研究 (Longitudinal design) 或密集追蹤設計 (Ecological Momentary Assessment, EMA)，方能確認變數間真實的時間序與因果循環。",

            const [cardPage, setCardPage] = useState(0);

            // 確保當前顯示的卡片與測驗計入 "已顯示/總計"

                if (data.cards) {
                    const idx1 = cardPage * 2, idx2 = idx1 + 1;
                    setAnalytics(prev => {
                        const nextCards = [...prev.cards];
                        const s = new Set(nextCards[tabIndex].shown);
                        if(idx1 < data.cards.length) s.add(idx1);
                        if(idx2 < data.cards.length) s.add(idx2);
                        nextCards[tabIndex] = { ...nextCards[tabIndex], shown: Array.from(s), total: data.cards.length };
                        return { ...prev, cards: nextCards };
                    });

            }, [cardPage, tabIndex]);

                if (data.quiz) {
                    setAnalytics(prev => {
                        const nextQuizzes = [...prev.quizzes];
                        nextQuizzes[tabIndex] = { ...nextQuizzes[tabIndex], total: data.quiz.length };
                        return { ...prev, quizzes: nextQuizzes };

            }, [tabIndex]);

                    const c = new Set(nextCards[tabIndex].clicked);
                    c.add(cIdx);
                    nextCards[tabIndex] = { ...nextCards[tabIndex], clicked: Array.from(c) };
                    return { ...prev, cards: nextCards, clicks: prev.clicks + 1 };
                });
            };

            const handleQuizAnswer = (qIdx, optIdx, isCorrect) => {
                setLocalQuizAns(prev => ({...prev, [qIdx]: optIdx}));
                setAnalytics(prev => {
                    const nextQuizzes = [...prev.quizzes];
                    const a = new Set(nextQuizzes[tabIndex].answered);
                    const c = new Set(nextQuizzes[tabIndex].correct);
                    a.add(qIdx);
                    if(isCorrect) c.add(qIdx);
                    nextQuizzes[tabIndex] = { ...nextQuizzes[tabIndex], answered: Array.from(a), correct: Array.from(c) };
                    return { ...prev, quizzes: nextQuizzes, clicks: prev.clicks + 1 };
                });
            };

            return (
                <div className="max-w-4xl mx-auto py-8 px-4 animate-fade-in">
                    <h1 className="text-3xl font-bold mb-6 text-bcg-navy dark:text-white border-b-2 border-bcg-accent pb-2">{data.title}</h1>
                    
                    <div className="flex flex-wrap gap-2 mb-6">
                        {data.highlights.map((hl, i) => (
                            <span key={i} className="bg-bcg-gray dark:bg-gray-800 text-bcg-navy dark:text-bcg-accent px-3 py-1 text-sm font-semibold rounded-full border border-gray-200 dark:border-gray-700">
                                <i className="fas fa-check-circle mr-2"></i>{hl}
                            </span>
                        ))}
                    </div>

                    <div className="prose dark:prose-invert max-w-none mb-10 text-lg leading-loose whitespace-pre-line text-justify">
                        {data.desc}
                    </div>

                    <div className="w-full h-auto bg-white dark:bg-bcg-darkcard rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-2 mb-10 overflow-hidden">
                        <TopicSVG tabIndex={tabIndex} isDark={isDark} />
                    </div>

                    {data.cards && (
                        <div className="mb-12 bg-gray-50 dark:bg-gray-900/50 p-6 rounded-lg">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                                <h2 className="text-xl font-bold flex items-center"><i className="fas fa-clone mr-2 text-bcg-accent"></i> Key Concepts ({cardPage + 1}/{(Math.ceil(data.cards.length/2))})</h2>
                                <span className="text-xs font-bold bg-bcg-navy text-white px-3 py-1.5 rounded-full shadow-sm">
                                    {t.ui.cardProgress.replace('{c}', currentCardStats.clicked.length).replace('{s}', currentCardStats.shown.length).replace('{t}', data.cards.length)}
                                </span>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                {data.cards[cardPage*2] && <FlipCard card={data.cards[cardPage*2]} isDark={isDark} handleCardClick={() => handleCardClick(cardPage*2)} />}
                                {data.cards[cardPage*2+1] && <FlipCard card={data.cards[cardPage*2+1]} isDark={isDark} handleCardClick={() => handleCardClick(cardPage*2+1)} />}
                            </div>
                            <div className="flex justify-end gap-2">
                                <button onClick={() => setCardPage(p => p===0 ? 1 : 0)} className="px-5 py-2 bg-bcg-navy text-white rounded hover:bg-opacity-90 transition text-sm font-bold shadow-sm">
                                    <i className="fas fa-exchange-alt mr-2"></i>{t.ui.nextGroup}
                                </button>
                            </div>
                        </div>
                    )}

                    {data.quiz && (
                        <div className="mb-8 border border-gray-200 dark:border-gray-700 rounded-lg p-6 bg-white dark:bg-bcg-darkcard">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-2">
                                <h2 className="text-xl font-bold flex items-center"><i className="fas fa-tasks mr-2 text-bcg-accent"></i> Quiz ({quizPage + 1}/{(Math.ceil(data.quiz.length/2))})</h2>
                                <span className="text-xs font-bold bg-green-700 dark:bg-green-600 text-white px-3 py-1.5 rounded-full shadow-sm">
                                    {t.ui.quizProgress.replace('{c}', currentQuizStats.correct.length).replace('{a}', currentQuizStats.answered.length).replace('{t}', data.quiz.length)}
                                </span>
                            </div>
                            <div className="space-y-6 mb-6">
                                {[0, 1].map(offset => {
                                    const qIdx = quizPage * 2 + offset;
                                    const qData = data.quiz[qIdx];
                                    if (!qData) return null;
                                    const userAns = localQuizAns[qIdx];

                                    return (
                                        <div key={qIdx} className="bg-gray-50 dark:bg-gray-800 p-5 rounded-lg border dark:border-gray-600 shadow-sm">
                                            <p className="font-semibold mb-4 text-lg">Q{qIdx+1}. {qData.q}</p>
                                            <div className="space-y-3">
                                                {qData.options.map((opt, i) => {
                                                    let btnClass = "w-full text-left p-3 rounded-lg border transition font-medium ";
                                                    if (userAns === undefined) btnClass += "border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 hover:shadow-sm";
                                                    else if (i === qData.ans) btnClass += "bg-green-100 border-green-500 text-green-800 dark:bg-green-900/40 dark:text-green-300 dark:border-green-600";
                                                    else if (userAns === i) btnClass += "bg-red-100 border-red-500 text-red-800 dark:bg-red-900/40 dark:text-red-300 dark:border-red-600";
                                                    else btnClass += "opacity-40 border-gray-200 dark:border-gray-700";

                                                    return (
                                                        <button key={i} onClick={() => handleQuizAnswer(qIdx, i, i === qData.ans)} disabled={userAns !== undefined} className={btnClass}>
                                                            {String.fromCharCode(65+i)}. {opt}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                            {userAns !== undefined && (
                                                <div className={`mt-4 text-sm font-bold flex items-center p-3 rounded-lg ${userAns === qData.ans ? 'bg-green-50 text-green-700 dark:bg-transparent dark:text-green-400' : 'bg-red-50 text-red-700 dark:bg-transparent dark:text-red-400'}`}>
                                                    <i className={`fas ${userAns === qData.ans ? 'fa-check-circle' : 'fa-times-circle'} mr-2 text-lg`}></i>
                                                    {userAns === qData.ans ? t.ui.correct : t.ui.wrong}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                            <div className="flex justify-end gap-2 mt-4">
                                <button onClick={() => setQuizPage(p => p===0 ? 1 : 0)} className="px-5 py-2 bg-bcg-navy text-white rounded hover:bg-opacity-90 transition text-sm font-bold shadow-sm">
                                    <i className="fas fa-exchange-alt mr-2"></i>{t.ui.nextGroup}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const InteractiveLabsContainer = ({ t }) => {
            const [labTab, setLabTab] = useState(0);
            const [xVal, setXVal] = useState(50); const [zVal, setZVal] = useState(50);
            const [simResult, setSimResult] = useState(null);

            const pathNodes = ["Y (不性婚育/Endgame)", "Me1 (數位替代/Digital Sub)", "X (科技普及/Tech Pop)", "Me2 (獨來獨往/Withdrawal)"];
            const correctPath = ["X (科技普及/Tech Pop)", "Me1 (數位替代/Digital Sub)", "Me2 (獨來獨往/Withdrawal)", "Y (不性婚育/Endgame)"];
            const [userPath, setUserPath] = useState([]);

            const scenarios = [
                { text: "覺得經營感情太累，寧願躺平不負責 (Rationalize relationship as burden)", ans: "Me2" },
                { text: "沉迷於虛擬戀人以獲得情緒價值 (Addicted to virtual partners)", ans: "Me1" },
                { text: "高速網路與智慧型手機高度覆蓋 (High accessibility of internet)", ans: "X" },
                { text: "徹底放棄未來結婚生子的規劃 (Completely abandoning marriage plans)", ans: "Y" }
            ];
            const [matched, setMatched] = useState({});
            const [methodAns, setMethodAns] = useState(null);

            return (
                <div className="max-w-4xl mx-auto py-8 px-4 animate-fade-in">
                    <h1 className="text-3xl font-bold mb-6 text-bcg-navy dark:text-white border-b-2 border-bcg-accent pb-2">7. Interactive Labs</h1>
                    
                    <div className="flex flex-wrap gap-2 mb-8 bg-gray-200 dark:bg-gray-800 p-1 rounded-lg">
                        {t.ui.labTabs.map((lName, i) => (
                            <button key={i} onClick={()=>setLabTab(i)} className={`flex-1 py-2 text-sm font-bold rounded-md transition ${labTab === i ? 'bg-white dark:bg-bcg-darkcard shadow text-bcg-navy dark:text-bcg-accent' : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'}`}>
                                {lName}
                            </button>
                        ))}
                    </div>

                    <div className="bg-white dark:bg-bcg-darkcard p-6 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 min-h-[400px]">
                        {labTab === 0 && (
                            <div>
                                <h2 className="text-xl font-bold mb-4"><i className="fas fa-sliders-h mr-2 text-bcg-accent"></i>動力模擬器 (Dynamic Simulator)</h2>
                                <p className="mb-6 text-sm text-gray-500">調整「科技暴露度」與「總體經濟壓力」，觀察對模型終局的理論預測影響。</p>
                                <div className="space-y-6">
                                    <div>
                                        <label className="block mb-2 font-semibold">科技暴露度 (X): {xVal}%</label>
                                        <input type="range" min="0" max="100" value={xVal} onChange={e=>setXVal(e.target.value)} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700"/>
                                    </div>
                                    <div>
                                        <label className="block mb-2 font-semibold">總體經濟/結構壓力 (Z): {zVal}%</label>
                                        <input type="range" min="0" max="100" value={zVal} onChange={e=>setZVal(e.target.value)} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700"/>
                                    </div>
                                    <button onClick={() => {
                                        const x = xVal/100, z = zVal/100;
                                        setSimResult({
                                            me1: Math.min(100, Math.round((x*0.6 + z*0.4)*100)),
                                            me2: Math.min(100, Math.round(((x*0.6+z*0.4)*0.5 + z*0.5)*100)),
                                            y: Math.min(100, Math.round((((x*0.6+z*0.4)*0.5 + z*0.5)*0.7 + z*0.3)*100))
                                        });
                                    }} className="w-full py-3 bg-bcg-navy text-white font-bold rounded hover:bg-opacity-90 transition">執行運算 (Run Simulation)</button>
                                    
                                    {simResult && (
                                        <div className="mt-6 p-4 bg-gray-50 dark:bg-gray-900 rounded border border-gray-200 dark:border-gray-700 animate-fade-in">
                                            <div className="space-y-3">
                                                <div><span className="text-sm font-bold">Me1 (數位依賴): {simResult.me1}%</span><div className="w-full bg-gray-200 rounded-full h-2 mt-1"><div className="bg-blue-500 h-2 rounded-full" style={{width: `${simResult.me1}%`}}></div></div></div>
                                                <div><span className="text-sm font-bold">Me2 (退縮/責任移轉): {simResult.me2}%</span><div className="w-full bg-gray-200 rounded-full h-2 mt-1"><div className="bg-purple-500 h-2 rounded-full" style={{width: `${simResult.me2}%`}}></div></div></div>
                                                <div><span className="text-sm font-bold">Y (不性婚育機率): {simResult.y}%</span><div className="w-full bg-gray-200 rounded-full h-2 mt-1"><div className="bg-red-500 h-2 rounded-full" style={{width: `${simResult.y}%`}}></div></div></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {labTab === 1 && (
                            <div>
                                <h2 className="text-xl font-bold mb-4"><i className="fas fa-project-diagram mr-2 text-bcg-accent"></i>因果路徑建構器 (Causal Path Builder)</h2>
                                <p className="mb-6 text-sm text-gray-500">請依序點擊下方節點，建立正確的因果鏈 (共4步)。</p>
                                <div className="flex gap-2 flex-wrap mb-8">
                                    {pathNodes.filter(n => !userPath.includes(n)).map((node, i) => (
                                        <button key={i} onClick={()=>setUserPath([...userPath, node])} className="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-full font-bold hover:bg-bcg-accent hover:text-white transition">
                                            {node} <i className="fas fa-plus ml-1"></i>
                                        </button>
                                    ))}
                                </div>
                                <div className="flex items-center gap-2 flex-wrap min-h-[60px] p-4 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg">
                                    {userPath.length === 0 && <span className="text-gray-400">路徑區 (請從上方選擇)</span>}
                                    {userPath.map((node, i) => (
                                        <React.Fragment key={i}>
                                            <div className="px-4 py-2 bg-bcg-navy text-white rounded-md font-bold text-sm sm:text-base">{node}</div>
                                            {i < userPath.length - 1 && <i className="fas fa-arrow-right text-gray-400"></i>}
                                        </React.Fragment>
                                    ))}
                                </div>
                                <div className="mt-4 flex gap-2">
                                    <button onClick={()=>setUserPath([])} className="px-4 py-2 bg-red-100 text-red-600 rounded font-bold hover:bg-red-200 transition">重置 (Reset)</button>
                                    {userPath.length === 4 && (
                                        <div className={`px-4 py-2 rounded font-bold flex-1 text-center animate-fade-in ${JSON.stringify(userPath) === JSON.stringify(correctPath) ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                            {JSON.stringify(userPath) === JSON.stringify(correctPath) ? '建構成功！正確還原核心論述。' : '順序有誤，請回顧單元1與單元2。'}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {labTab === 2 && (
                            <div>
                                <h2 className="text-xl font-bold mb-4"><i className="fas fa-puzzle-piece mr-2 text-bcg-accent"></i>構念情境配對 (Construct Match)</h2>
                                <p className="mb-6 text-sm text-gray-500">判斷以下情境分別屬於哪一個模型變數？</p>
                                <div className="space-y-4">
                                    {scenarios.map((sc, idx) => (
                                        <div key={idx} className="flex flex-col md:flex-row md:items-center justify-between p-3 border rounded dark:border-gray-600 bg-gray-50 dark:bg-gray-800">
                                            <div className="font-medium mb-3 md:mb-0 text-sm">{sc.text}</div>
                                            <div className="flex gap-2">
                                                {["X", "Me1", "Me2", "Y"].map(v => (
                                                    <button key={v} onClick={() => setMatched({...matched, [idx]: v})}
                                                        className={`px-4 py-1.5 rounded border text-sm font-bold transition ${matched[idx] === v ? (matched[idx] === sc.ans ? 'bg-green-500 text-white border-green-500 shadow' : 'bg-red-500 text-white border-red-500 shadow') : 'bg-white text-gray-600 hover:bg-gray-100 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600'}`}>
                                                        {v}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {labTab === 3 && (
                            <div>
                                <h2 className="text-xl font-bold mb-4"><i className="fas fa-code-branch mr-2 text-bcg-accent"></i>實證方法決策樹 (Method Decision)</h2>
                                <p className="mb-6 text-sm text-gray-500 text-justify">情境：您獲得了一筆連續三年追蹤東亞青年行為的縱貫數據，希望能嚴謹驗證「數位替代」與「社會退縮」之間是單向影響還是『惡性循環(互相影響)』。您應該選擇哪種高階統計模型？</p>
                                <div className="space-y-3">
                                    {[
                                        { name: "一般線性多元迴歸 (Multiple Regression)", correct: false, msg: "無法處理隨時間變化的雙向因果關係。" },
                                        { name: "隨機截距交叉延遲模型 (RI-CLPM)", correct: true, msg: "正確！RI-CLPM 能分離組間差異與組內動態，是驗證迴饋迴路 (Feedback Loop) 的黃金標準。" },
                                        { name: "多群組結構方程式 (Multi-group SEM)", correct: false, msg: "這是用來驗證總體調節變數 (Z) 在不同群體間差異的方法，非針對時間迴路。" }
                                    ].map((opt, i) => (
                                        <div key={i}>
                                            <button onClick={()=>setMethodAns(i)} className={`w-full text-left p-4 border rounded-lg font-bold transition shadow-sm ${methodAns === i ? (opt.correct ? 'bg-green-50 border-green-500 dark:bg-green-900/40 text-green-700 dark:text-green-300' : 'bg-red-50 border-red-500 dark:bg-red-900/40 text-red-700 dark:text-red-300') : 'bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 border-gray-300 dark:border-gray-600'}`}>
                                                {opt.name}
                                            </button>
                                            {methodAns === i && <div className={`text-sm mt-2 ml-2 animate-fade-in font-semibold ${opt.correct ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}`}>{opt.msg}</div>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AnalyticsPage = ({ t, analytics, userInfo, setUserInfo, handleExport }) => {
            const sumTime = analytics.timeSpent.reduce((a,b)=>a+b,0);
            const sumCardsClicked = analytics.cards.reduce((a,b)=>a+b.clicked.length,0);
            const sumCardsTotal = analytics.cards.reduce((a,b)=>a+b.total,0);
            const sumQuizCorrect = analytics.quizzes.reduce((a,b)=>a+b.correct.length,0);
            const sumQuizTotal = analytics.quizzes.reduce((a,b)=>a+b.total,0);

            return (
                <div className="max-w-5xl mx-auto py-8 px-4 animate-fade-in">
                    <h1 className="text-3xl font-bold mb-6 text-bcg-navy dark:text-white border-b-2 border-bcg-accent pb-2">{t.nav[9]}</h1>
                    
                    {/* Totals */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <div className="bg-white dark:bg-bcg-darkcard p-4 rounded-lg shadow text-center border-t-4 border-bcg-navy dark:border-bcg-accent">
                            <div className="text-sm text-gray-500 dark:text-gray-400 mb-2">{t.ui.stats[0]}</div>
                            <div className="text-3xl font-bold text-bcg-navy dark:text-white">{sumTime}</div>
                        </div>
                        <div className="bg-white dark:bg-bcg-darkcard p-4 rounded-lg shadow text-center border-t-4 border-bcg-navy dark:border-bcg-accent">
                            <div className="text-sm text-gray-500 dark:text-gray-400 mb-2">{t.ui.stats[1]}</div>
                            <div className="text-3xl font-bold text-bcg-navy dark:text-white">{analytics.clicks}</div>
                        </div>
                        <div className="bg-white dark:bg-bcg-darkcard p-4 rounded-lg shadow text-center border-t-4 border-bcg-navy dark:border-bcg-accent">
                            <div className="text-sm text-gray-500 dark:text-gray-400 mb-2">{t.ui.stats[2]}</div>
                            <div className="text-3xl font-bold text-bcg-navy dark:text-white">{sumCardsClicked} / {sumCardsTotal}</div>
                        </div>
                        <div className="bg-white dark:bg-bcg-darkcard p-4 rounded-lg shadow text-center border-t-4 border-bcg-navy dark:border-bcg-accent">
                            <div className="text-sm text-gray-500 dark:text-gray-400 mb-2">{t.ui.stats[3]}</div>
                            <div className="text-3xl font-bold text-bcg-navy dark:text-white">{sumQuizCorrect} / {sumQuizTotal}</div>
                        </div>
                    </div>

                    {/* Breakdown */}
                    <div className="bg-white dark:bg-bcg-darkcard p-6 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 mb-8 overflow-x-auto">
                        <h2 className="text-xl font-bold mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">各單元歷程分析 (Module Breakdown)</h2>
                        <table className="w-full text-left text-sm min-w-[600px]">
                            <thead>
                                <tr className="border-b dark:border-gray-700 text-gray-600 dark:text-gray-400">
                                    <th className="py-2 px-2">單元 (Module)</th>
                                    <th className="py-2 px-2">時間 (Sec)</th>
                                    <th className="py-2 px-2">翻轉卡 (Clicked/Shown)</th>
                                    <th className="py-2 px-2">測驗 (Correct/Answered)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {[0,1,2,3,4,5,6].map(i => (
                                    <tr key={i} className="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition">
                                        <td className="py-3 px-2 font-semibold text-bcg-navy dark:text-gray-200">{t.nav[i]}</td>
                                        <td className="py-3 px-2 font-bold">{analytics.timeSpent[i]}</td>
                                        <td className="py-3 px-2">{analytics.cards[i].clicked.length} / {analytics.cards[i].shown.length} <span className="text-gray-400 ml-1">(Total: {analytics.cards[i].total})</span></td>
                                        <td className="py-3 px-2 text-green-600 dark:text-green-400 font-bold">{analytics.quizzes[i].correct.length} / {analytics.quizzes[i].answered.length} <span className="text-gray-400 font-normal ml-1">(Total: {analytics.quizzes[i].total})</span></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <div className="bg-white dark:bg-bcg-darkcard p-6 rounded-lg shadow-md border border-gray-200 dark:border-gray-700">
                        <h2 className="text-xl font-bold mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">資料匯出設定 (Export Data)</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <input type="text" placeholder={t.ui.group + " (例: G1)"} className="p-3 border rounded-lg dark:bg-gray-800 dark:border-gray-600 focus:outline-none focus:border-bcg-accent transition" value={userInfo.group} onChange={e=>setUserInfo({...userInfo, group: e.target.value})}/>
                            <input type="text" placeholder={t.ui.studentId + " (例: 113212599)"} className="p-3 border rounded-lg dark:bg-gray-800 dark:border-gray-600 focus:outline-none focus:border-bcg-accent transition" value={userInfo.studentId} onChange={e=>setUserInfo({...userInfo, studentId: e.target.value})}/>
                            <input type="text" placeholder={t.ui.name + " (例: Shihmin Lo)"} className="p-3 border rounded-lg dark:bg-gray-800 dark:border-gray-600 focus:outline-none focus:border-bcg-accent transition" value={userInfo.name} onChange={e=>setUserInfo({...userInfo, name: e.target.value})}/>
                        </div>
                        <div className="flex flex-col md:flex-row gap-4">
                            <button onClick={handleExport} className="flex-1 bg-bcg-navy text-white py-3 rounded-lg hover:bg-opacity-90 transition font-bold shadow-md"><i className="fas fa-file-csv mr-2"></i>{t.ui.export}</button>
                            <button onClick={() => {if(confirm('確定刷新所有學習記錄？ / Are you sure to clear records?')) window.location.reload();}} className="px-6 bg-red-600 text-white py-3 rounded-lg hover:bg-red-700 transition font-bold shadow-md"><i className="fas fa-trash-alt mr-2"></i>{t.ui.clear}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('tw');
            const [isDark, setIsDark] = useState(true);
            const [activeTab, setActiveTab] = useState(0);
            const [menuOpen, setMenuOpen] = useState(false);
            
            // Initialization: All units have 4 cards and 4 quizzes to track
            const [analytics, setAnalytics] = useState(() => {
                let initial = { timeSpent: Array(10).fill(0), clicks: 0, cards: [], quizzes: [] };
                for(let i=0; i<10; i++) {
                    initial.cards.push({ clicked: [], shown: [], total: 0 });
                    initial.quizzes.push({ correct: [], answered: [], total: 0 });
                }
                return initial;
            });
            const [userInfo, setUserInfo] = useState({ group: '', studentId: '', name: '' });
            const [isSpeaking, setIsSpeaking] = useState(false);
            const speechSynth = window.speechSynthesis;

            const t = dict[lang];
            const headerTitle = lang === 'en' ? "Technologies Substitute Close Relationships" : "理論前導：數位替代與不性婚育模型";

            useEffect(() => {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDark]);

            useEffect(() => {
                const timer = setInterval(() => {
                    setAnalytics(prev => {
                        const newTime = [...prev.timeSpent];
                        newTime[activeTab] += 1;
                        return { ...prev, timeSpent: newTime };
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [activeTab]);

            useEffect(() => {
                const handleClick = () => setAnalytics(prev => ({ ...prev, clicks: prev.clicks + 1 }));
                window.addEventListener('click', handleClick);
                return () => window.removeEventListener('click', handleClick);
            }, []);

            const handleTTSPlay = () => {
                speechSynth.cancel(); 
                let textToRead = "";

                if (activeTab >= 0 && activeTab <= 6) {
                    const d = t.content[activeTab];
                    textToRead += `${d.title}. \n\n`;
                    textToRead += d.highlights.join(". ") + ". \n\n";
                    textToRead += `${d.desc} \n\n`;
                    if (d.cards) d.cards.forEach(c => { textToRead += `${c.front}. ${c.back}. \n`; });
                } else if (activeTab === 7) {
                    textToRead = "Interactive Labs. " + t.ui.labTabs.join(". ") + ". Please interact below.";
                } else {
                    textToRead = t.nav[activeTab];
                }

                const utterance = new SpeechSynthesisUtterance(textToRead);
                const voices = speechSynth.getVoices();
                if (lang === 'tw') {
                    utterance.lang = 'zh-TW';
                    const twVoice = voices.find(v => v.name.includes('Yating') || v.name.includes('Taiwan')) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.includes('zh'));
                    if (twVoice) utterance.voice = twVoice;
                } else {
                    utterance.lang = 'en-GB';
                    const enVoice = voices.find(v => (v.name.includes('UK') || v.name.includes('British')) && v.name.includes('Male')) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.includes('en'));
                    if (enVoice) utterance.voice = enVoice;
                }
                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);

                speechSynth.speak(utterance);
                setIsSpeaking(true);
            };

            const handleTTSPause = () => { if (speechSynth.speaking) { if (speechSynth.paused) speechSynth.resume(); else speechSynth.pause(); } };
            const handleTTSStop = () => { speechSynth.cancel(); setIsSpeaking(false); };
            useEffect(() => { handleTTSStop(); }, [activeTab, lang]);

            const handleExport = () => {
                let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                csvContent += "Group,Student ID,Name,Date,Total Clicks,Total Time(s)\n";
                const date = new Date().toISOString().split('T')[0];
                const sumTime = analytics.timeSpent.reduce((a,b)=>a+b,0);
                csvContent += `${userInfo.group},${userInfo.studentId},${userInfo.name},${date},${analytics.clicks},${sumTime}\n\n`;
                
                csvContent += "Module,Time Spent (s),Cards Clicked,Cards Shown,Quiz Correct,Quiz Answered\n";
                [0,1,2,3,4,5,6].forEach(i => { 
                    csvContent += `${t.nav[i]},${analytics.timeSpent[i]},${analytics.cards[i].clicked.length},${analytics.cards[i].shown.length},${analytics.quizzes[i].correct.length},${analytics.quizzes[i].answered.length}\n`; 
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `SPA_${userInfo.group}_${userInfo.name}_${date}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <>
                    <header className="bg-white dark:bg-bcg-darkcard shadow-md sticky top-0 z-40 h-16 flex items-center justify-between px-4 lg:px-8 border-b border-gray-200 dark:border-gray-800 transition-colors">
                        <div className="flex items-center gap-3">
                            <div className="relative z-50">
                                <button onClick={() => setMenuOpen(!menuOpen)} className="text-2xl p-2 hover:text-bcg-accent transition"><i className="fas fa-bars"></i></button>
                                {menuOpen && (
                                    <div className="absolute top-12 left-0 w-72 bg-white dark:bg-bcg-darkcard border border-gray-200 dark:border-gray-700 shadow-2xl rounded-md overflow-hidden">
                                        {t.nav.map((item, idx) => (
                                            <button key={idx} onClick={() => { setActiveTab(idx); setMenuOpen(false); window.scrollTo({top:0, behavior:'smooth'}); }}
                                                className={`w-full text-left px-4 py-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition text-sm ${activeTab === idx ? 'bg-bcg-gray text-bcg-navy dark:bg-gray-900 dark:text-bcg-accent font-bold border-l-4 border-l-bcg-accent' : ''}`}>
                                                {item}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <h1 className="font-bold text-lg md:text-xl text-bcg-navy dark:text-white truncate hidden sm:block">
                                <i className="fas fa-project-diagram mr-2 text-bcg-accent"></i>{headerTitle}
                            </h1>
                        </div>
                        <div className="flex items-center gap-2 md:gap-4 text-sm">
                            {/* Home Button Header */}
                            <button onClick={() => { setActiveTab(0); window.scrollTo({top:0, behavior:'smooth'}); }} className="text-xl hover:scale-110 transition text-bcg-navy dark:text-gray-300 mr-1" title={t.ui.home}>
                                <i className="fas fa-home"></i>
                            </button>

                            <div className="hidden md:flex items-center gap-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-full border border-gray-200 dark:border-gray-700">
                                <button onClick={handleTTSPlay} className={`w-8 h-8 rounded-full flex items-center justify-center transition ${isSpeaking ? 'bg-green-100 dark:bg-green-900 text-green-600' : 'hover:bg-white dark:hover:bg-gray-600 text-green-600 dark:text-green-400'}`} title={t.ui.play}><i className="fas fa-play"></i></button>
                                <button onClick={handleTTSPause} className="w-8 h-8 rounded-full hover:bg-white dark:hover:bg-gray-600 flex items-center justify-center transition text-yellow-600 dark:text-yellow-400" title={t.ui.pause}><i className="fas fa-pause"></i></button>
                                <button onClick={handleTTSStop} className="w-8 h-8 rounded-full hover:bg-white dark:hover:bg-gray-600 flex items-center justify-center transition text-red-600 dark:text-red-400" title={t.ui.stop}><i className="fas fa-stop"></i></button>
                            </div>
                            <button onClick={() => setLang(lang === 'tw' ? 'en' : 'tw')} className="font-bold px-3 py-1.5 bg-bcg-navy text-white rounded hover:bg-opacity-80 transition shadow-sm border border-transparent">
                                {lang === 'tw' ? 'EN' : 'TW'}
                            </button>
                            <button onClick={() => setIsDark(!isDark)} className="text-xl hover:scale-110 transition ml-1" title={isDark ? t.ui.themeDark : t.ui.themeLight}>
                                {isDark ? <i className="fas fa-sun text-yellow-400"></i> : <i className="fas fa-moon text-gray-600"></i>}
                            </button>
                        </div>
                    </header>

                    <main className="flex-grow pb-24">
                        {/* Note: The key={activeTab} below is CRUCIAL. It forces React to unmount and remount the component when the tab changes, 
                            which automatically resets all local states like cardPage, quizPage, localQuizAns, and card flipped status. */}
                        {activeTab >= 0 && activeTab <= 6 && 
                            <ContentModule key={`content-${activeTab}`} data={t.content[activeTab]} tabIndex={activeTab} t={t} analytics={analytics} setAnalytics={setAnalytics} isDark={isDark} currentCardStats={analytics.cards[activeTab]} currentQuizStats={analytics.quizzes[activeTab]}/>
                        }
                        {activeTab === 7 && <InteractiveLabsContainer key="labs" t={t} />}
                        {activeTab === 8 && <div key="resources" className="max-w-4xl mx-auto py-20 text-center text-xl text-gray-500 font-bold"><i className="fas fa-link mr-2"></i>外部學習資源 (建置中) / External Resources</div>}
                        {activeTab === 9 && <AnalyticsPage key="analytics" t={t} analytics={analytics} userInfo={userInfo} setUserInfo={setUserInfo} handleExport={handleExport} />}
                        
                        <div className="max-w-4xl mx-auto px-4 flex justify-between mt-8 pt-6 border-t border-gray-200 dark:border-gray-800">
                            <button onClick={() => { if(activeTab > 0) { setActiveTab(activeTab - 1); window.scrollTo(0,0); } }} className={`px-4 py-2 flex items-center ${activeTab === 0 ? 'invisible' : 'text-bcg-navy dark:text-bcg-accent hover:underline font-bold'}`}><i className="fas fa-chevron-left mr-2"></i> {t.ui.prev}</button>
                            <button onClick={() => { if(activeTab < 9) { setActiveTab(activeTab + 1); window.scrollTo(0,0); } }} className={`px-4 py-2 flex items-center ${activeTab === 9 ? 'invisible' : 'text-bcg-navy dark:text-bcg-accent hover:underline font-bold'}`}>{t.ui.next} <i className="fas fa-chevron-right ml-2"></i></button>
                        </div>
                    </main>

                    <footer className="bg-white dark:bg-bcg-darkcard border-t border-gray-200 dark:border-gray-800 h-12 flex items-center justify-between px-4 lg:px-8 text-xs sm:text-sm text-gray-500 dark:text-gray-400 fixed bottom-0 w-full z-40 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                        <div>Ver 2026.04 | &copy; 2026 All Rights Reserved.</div>
                        <div className="flex items-center gap-4">
                            <span className="hidden sm:inline">Architect: <a href="https://www.ibs.ncnu.edu.tw/index.php/faculty/tenured-professor/299-smlo" target="_blank" className="text-bcg-navy dark:text-bcg-accent hover:underline font-bold">Prof. Shihmin Lo</a></span>
                            {/* Home Button Footer */}
                            <button onClick={() => { setActiveTab(0); window.scrollTo({top: 0, behavior: 'smooth'}); }} className="hover:text-bcg-navy dark:hover:text-white transition font-bold"><i className="fas fa-home mr-1"></i>Home</button>
                            <button onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})} className="hover:text-bcg-navy dark:hover:text-white transition font-bold"><i className="fas fa-arrow-up mr-1"></i>Top</button>
                        </div>
                    </footer>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
