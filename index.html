                        if(idx2 < data.cards.length) s.add(idx2);

                        return { ...prev, cards: nextCards };

                    const c = new Set(nextCards[tabIndex].clicked);

                                            <div className="px-4 py-2 bg-bcg-navy text-white rounded-md font-bold">{node}</div>
                                            {i < userPath.length - 1 && <i className="fas fa-arrow-right text-gray-400"></i>}
                                        </React.Fragment>
                                    ))}
                                </div>
                                <div className="mt-4 flex gap-2">
                                    <button onClick={()=>setUserPath([])} className="px-4 py-2 bg-red-100 text-red-600 rounded font-bold">重置 (Reset)</button>
                                    {userPath.length === 4 && (
                                        <div className={`px-4 py-2 rounded font-bold flex-1 text-center ${JSON.stringify(userPath) === JSON.stringify(correctPath) ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                            {JSON.stringify(userPath) === JSON.stringify(correctPath) ? '建構成功！正確還原核心論述。' : '順序有誤，請回顧單元1與單元2。'}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {labTab === 2 && (
                            <div>
                                <h2 className="text-xl font-bold mb-4"><i className="fas fa-puzzle-piece mr-2 text-bcg-accent"></i>構念情境配對 (Construct Match)</h2>
                                <p className="mb-6 text-sm text-gray-500">判斷以下情境分別屬於哪一個模型變數？</p>
                                <div className="space-y-4">
                                    {scenarios.map((sc, idx) => (
                                        <div key={idx} className="flex flex-col md:flex-row md:items-center justify-between p-3 border rounded dark:border-gray-600 bg-gray-50 dark:bg-gray-800">
                                            <div className="font-medium mb-2 md:mb-0 text-sm">{sc.text}</div>
                                            <div className="flex gap-2">
                                                {["X", "Me1", "Me2", "Y"].map(v => (
                                                    <button key={v} onClick={() => setMatched({...matched, [idx]: v})}
                                                        className={`px-3 py-1 rounded border text-sm font-bold ${matched[idx] === v ? (matched[idx] === sc.ans ? 'bg-green-500 text-white border-green-500' : 'bg-red-500 text-white border-red-500') : 'bg-white text-gray-600 dark:bg-gray-700 dark:text-gray-200'}`}>
                                                        {v}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {labTab === 3 && (
                            <div>
                                <h2 className="text-xl font-bold mb-4"><i className="fas fa-code-branch mr-2 text-bcg-accent"></i>實證方法決策樹 (Method Decision)</h2>
                                <p className="mb-6 text-sm text-gray-500">情境：您獲得了一筆連續三年追蹤東亞青年行為的數據，希望能驗證「數位替代」與「社會退縮」之間是單向影響還是『惡性循環(互相影響)』。您應該選擇哪種高階統計模型？</p>
                                <div className="space-y-3">
                                    {[
                                        { name: "一般多元迴歸 (Multiple Regression)", correct: false, msg: "無法處理隨時間變化的雙向因果關係。" },
                                        { name: "交叉延遲模型 (RI-CLPM)", correct: true, msg: "正確！RI-CLPM 能分離組間差異與組內動態，是驗證迴饋迴路 (Feedback Loop) 的黃金標準。" },
                                        { name: "多群組分析 (Multi-group SEM)", correct: false, msg: "這是用來驗證調節變數 (Z) 在不同群體間差異的方法，非針對時間迴路。" }
                                    ].map((opt, i) => (
                                        <div key={i}>
                                            <button onClick={()=>setMethodAns(i)} className={`w-full text-left p-3 border rounded font-bold transition ${methodAns === i ? (opt.correct ? 'bg-green-100 border-green-500 dark:bg-green-900/40 text-green-700 dark:text-green-300' : 'bg-red-100 border-red-500 dark:bg-red-900/40 text-red-700 dark:text-red-300') : 'hover:bg-gray-100 dark:hover:bg-gray-700 border-gray-300 dark:border-gray-600'}`}>
                                                {opt.name}
                                            </button>
                                            {methodAns === i && <div className={`text-sm mt-1 ml-2 ${opt.correct ? 'text-green-600' : 'text-red-500'}`}>{opt.msg}</div>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AnalyticsPage = ({ t, analytics, userInfo, setUserInfo, handleExport }) => {
            const sumTime = analytics.timeSpent.reduce((a,b)=>a+b,0);
            const sumCardsClicked = analytics.cards.reduce((a,b)=>a+b.clicked.length,0);
            const sumCardsTotal = analytics.cards.reduce((a,b)=>a+b.total,0);
            const sumQuizCorrect = analytics.quizzes.reduce((a,b)=>a+b.correct.length,0);
            const sumQuizTotal = analytics.quizzes.reduce((a,b)=>a+b.total,0);

            return (
                <div className="max-w-5xl mx-auto py-8 px-4 animate-fade-in">
                    <h1 className="text-3xl font-bold mb-6 text-bcg-navy dark:text-white border-b-2 border-bcg-accent pb-2">{t.nav[9]}</h1>
                    
                    {/* Totals */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <div className="bg-white dark:bg-bcg-darkcard p-4 rounded-lg shadow text-center border-t-4 border-bcg-navy dark:border-bcg-accent">
                            <div className="text-sm text-gray-500 dark:text-gray-400 mb-2">{t.ui.stats[0]}</div>
                            <div className="text-3xl font-bold text-bcg-navy dark:text-white">{sumTime}</div>
                        </div>
                        <div className="bg-white dark:bg-bcg-darkcard p-4 rounded-lg shadow text-center border-t-4 border-bcg-navy dark:border-bcg-accent">
                            <div className="text-sm text-gray-500 dark:text-gray-400 mb-2">{t.ui.stats[1]}</div>
                            <div className="text-3xl font-bold text-bcg-navy dark:text-white">{analytics.clicks}</div>
                        </div>
                        <div className="bg-white dark:bg-bcg-darkcard p-4 rounded-lg shadow text-center border-t-4 border-bcg-navy dark:border-bcg-accent">
                            <div className="text-sm text-gray-500 dark:text-gray-400 mb-2">{t.ui.stats[2]}</div>
                            <div className="text-3xl font-bold text-bcg-navy dark:text-white">{sumCardsClicked} / {sumCardsTotal}</div>
                        </div>
                        <div className="bg-white dark:bg-bcg-darkcard p-4 rounded-lg shadow text-center border-t-4 border-bcg-navy dark:border-bcg-accent">
                            <div className="text-sm text-gray-500 dark:text-gray-400 mb-2">{t.ui.stats[3]}</div>
                            <div className="text-3xl font-bold text-bcg-navy dark:text-white">{sumQuizCorrect} / {sumQuizTotal}</div>
                        </div>
                    </div>

                    {/* Breakdown */}
                    <div className="bg-white dark:bg-bcg-darkcard p-6 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 mb-8 overflow-x-auto">
                        <h2 className="text-xl font-bold mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">各單元歷程分析 (Module Breakdown)</h2>
                        <table className="w-full text-left text-sm">
                            <thead>
                                <tr className="border-b dark:border-gray-700">
                                    <th className="py-2">單元 (Module)</th>
                                    <th className="py-2">時間 (Sec)</th>
                                    <th className="py-2">翻轉卡 (Clicked/Shown)</th>
                                    <th className="py-2">測驗 (Correct/Answered)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {[0,1,2,3,4,5,6].map(i => (
                                    <tr key={i} className="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800">
                                        <td className="py-3 font-semibold">{t.nav[i]}</td>
                                        <td className="py-3">{analytics.timeSpent[i]}</td>
                                        <td className="py-3">{analytics.cards[i].clicked.length} / {analytics.cards[i].shown.length}</td>
                                        <td className="py-3 text-green-600 dark:text-green-400 font-bold">{analytics.quizzes[i].correct.length} / {analytics.quizzes[i].answered.length}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <div className="bg-white dark:bg-bcg-darkcard p-6 rounded-lg shadow-md border border-gray-200 dark:border-gray-700">
                        <h2 className="text-xl font-bold mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">資料匯出設定 (Export Data)</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <input type="text" placeholder={t.ui.group + " (例: G1)"} className="p-3 border rounded dark:bg-gray-800 dark:border-gray-600 focus:outline-none focus:border-bcg-accent" value={userInfo.group} onChange={e=>setUserInfo({...userInfo, group: e.target.value})}/>
                            <input type="text" placeholder={t.ui.studentId + " (例: 113212599)"} className="p-3 border rounded dark:bg-gray-800 dark:border-gray-600 focus:outline-none focus:border-bcg-accent" value={userInfo.studentId} onChange={e=>setUserInfo({...userInfo, studentId: e.target.value})}/>
                            <input type="text" placeholder={t.ui.name + " (例: Shihmin Lo)"} className="p-3 border rounded dark:bg-gray-800 dark:border-gray-600 focus:outline-none focus:border-bcg-accent" value={userInfo.name} onChange={e=>setUserInfo({...userInfo, name: e.target.value})}/>
                        </div>
                        <div className="flex flex-col md:flex-row gap-4">
                            <button onClick={handleExport} className="flex-1 bg-bcg-navy text-white py-3 rounded hover:bg-opacity-90 transition font-bold shadow-md"><i className="fas fa-file-csv mr-2"></i>{t.ui.export}</button>
                            <button onClick={() => {if(confirm('確定刷新所有學習記錄？ / Are you sure to clear records?')) window.location.reload();}} className="px-6 bg-red-600 text-white py-3 rounded hover:bg-red-700 transition font-bold shadow-md"><i className="fas fa-trash-alt mr-2"></i>{t.ui.clear}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('tw');
            const [isDark, setIsDark] = useState(true);
            const [activeTab, setActiveTab] = useState(0);
            const [menuOpen, setMenuOpen] = useState(false);
            
            // Initializing Analytics State correctly
            const [analytics, setAnalytics] = useState(() => {
                let initial = { timeSpent: Array(10).fill(0), clicks: 0, cards: [], quizzes: [] };
                for(let i=0; i<10; i++) {
                    // Set total to 4 cards, except maybe other pages but we standardize to 4
                    initial.cards.push({ clicked: [], shown: [], total: 4 });
                    initial.quizzes.push({ correct: [], answered: [], total: 4 });
                }
                return initial;
            });
            const [userInfo, setUserInfo] = useState({ group: '', studentId: '', name: '' });
            const [isSpeaking, setIsSpeaking] = useState(false);
            const speechSynth = window.speechSynthesis;

            const t = dict[lang];
            const headerTitle = lang === 'en' ? "Technologies Substitute Close Relationships" : "理論前導：數位替代與不性婚育模型";

            useEffect(() => {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDark]);

            useEffect(() => {
                const timer = setInterval(() => {
                    setAnalytics(prev => {
                        const newTime = [...prev.timeSpent];
                        newTime[activeTab] += 1;
                        return { ...prev, timeSpent: newTime };
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [activeTab]);

            useEffect(() => {
                const handleClick = () => setAnalytics(prev => ({ ...prev, clicks: prev.clicks + 1 }));
                window.addEventListener('click', handleClick);
                return () => window.removeEventListener('click', handleClick);
            }, []);

            const handleTTSPlay = () => {
                speechSynth.cancel(); 
                let textToRead = "";

                if (activeTab >= 0 && activeTab <= 6) {
                    const d = t.content[activeTab];
                    textToRead += `${d.title}. \n\n`;
                    textToRead += d.highlights.join(". ") + ". \n\n";
                    textToRead += `${d.desc} \n\n`;
                    if (d.cards) d.cards.forEach(c => { textToRead += `${c.front}. ${c.back}. \n`; });
                } else if (activeTab === 7) {
                    textToRead = "Interactive Labs. " + t.ui.labTabs.join(". ") + ". Please interact below.";
                } else {
                    textToRead = t.nav[activeTab];
                }

                const utterance = new SpeechSynthesisUtterance(textToRead);
                const voices = speechSynth.getVoices();
                if (lang === 'tw') {
                    utterance.lang = 'zh-TW';
                    const twVoice = voices.find(v => v.name.includes('Yating') || v.name.includes('Taiwan')) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.includes('zh'));
                    if (twVoice) utterance.voice = twVoice;
                } else {
                    utterance.lang = 'en-GB';
                    const enVoice = voices.find(v => (v.name.includes('UK') || v.name.includes('British')) && v.name.includes('Male')) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.includes('en'));
                    if (enVoice) utterance.voice = enVoice;
                }
                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);

                speechSynth.speak(utterance);
                setIsSpeaking(true);
            };

            const handleTTSPause = () => { if (speechSynth.speaking) { if (speechSynth.paused) speechSynth.resume(); else speechSynth.pause(); } };
            const handleTTSStop = () => { speechSynth.cancel(); setIsSpeaking(false); };
            useEffect(() => { handleTTSStop(); }, [activeTab, lang]);

            const handleExport = () => {
                let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                csvContent += "Group,Student ID,Name,Date,Total Clicks,Total Time(s)\n";
                const date = new Date().toISOString().split('T')[0];
                const sumTime = analytics.timeSpent.reduce((a,b)=>a+b,0);
                csvContent += `${userInfo.group},${userInfo.studentId},${userInfo.name},${date},${analytics.clicks},${sumTime}\n\n`;
                
                csvContent += "Module,Time Spent (s),Cards Clicked,Cards Shown,Quiz Correct,Quiz Answered\n";
                [0,1,2,3,4,5,6].forEach(i => { 
                    csvContent += `${t.nav[i]},${analytics.timeSpent[i]},${analytics.cards[i].clicked.length},${analytics.cards[i].shown.length},${analytics.quizzes[i].correct.length},${analytics.quizzes[i].answered.length}\n`; 
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `SPA_${userInfo.group}_${userInfo.name}_${date}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <>
                    <header className="bg-white dark:bg-bcg-darkcard shadow-md sticky top-0 z-40 h-16 flex items-center justify-between px-4 lg:px-8 border-b border-gray-200 dark:border-gray-800 transition-colors">
                        <div className="flex items-center gap-4">
                            <div className="relative z-50">
                                <button onClick={() => setMenuOpen(!menuOpen)} className="text-2xl p-2 hover:text-bcg-accent transition"><i className="fas fa-bars"></i></button>
                                {menuOpen && (
                                    <div className="absolute top-12 left-0 w-72 bg-white dark:bg-bcg-darkcard border border-gray-200 dark:border-gray-700 shadow-2xl rounded-md overflow-hidden">
                                        {t.nav.map((item, idx) => (
                                            <button key={idx} onClick={() => { setActiveTab(idx); setMenuOpen(false); window.scrollTo({top:0, behavior:'smooth'}); }}
                                                className={`w-full text-left px-4 py-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition text-sm ${activeTab === idx ? 'bg-bcg-gray text-bcg-navy dark:bg-gray-900 dark:text-bcg-accent font-bold border-l-4 border-l-bcg-accent' : ''}`}>
                                                {item}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <h1 className="font-bold text-lg md:text-xl text-bcg-navy dark:text-white cursor-pointer truncate hidden sm:block" onClick={() => window.scrollTo({top:0, behavior:'smooth'})}>
                                <i className="fas fa-project-diagram mr-2 text-bcg-accent"></i>{headerTitle}
                            </h1>
                        </div>
                        <div className="flex items-center gap-2 md:gap-4 text-sm">
                            <div className="flex items-center gap-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-full border border-gray-200 dark:border-gray-700">
                                <button onClick={handleTTSPlay} className={`w-8 h-8 rounded-full flex items-center justify-center transition ${isSpeaking ? 'bg-green-100 dark:bg-green-900 text-green-600' : 'hover:bg-white dark:hover:bg-gray-600 text-green-600 dark:text-green-400'}`} title={t.ui.play}><i className="fas fa-play"></i></button>
                                <button onClick={handleTTSPause} className="w-8 h-8 rounded-full hover:bg-white dark:hover:bg-gray-600 flex items-center justify-center transition text-yellow-600 dark:text-yellow-400" title={t.ui.pause}><i className="fas fa-pause"></i></button>
                                <button onClick={handleTTSStop} className="w-8 h-8 rounded-full hover:bg-white dark:hover:bg-gray-600 flex items-center justify-center transition text-red-600 dark:text-red-400" title={t.ui.stop}><i className="fas fa-stop"></i></button>
                            </div>
                            <button onClick={() => setLang(lang === 'tw' ? 'en' : 'tw')} className="font-bold px-3 py-1.5 bg-bcg-navy text-white rounded hover:bg-opacity-80 transition shadow-sm border border-transparent">
                                {lang === 'tw' ? 'EN' : 'TW'}
                            </button>
                            <button onClick={() => setIsDark(!isDark)} className="text-xl hover:scale-110 transition ml-2" title={isDark ? t.ui.themeDark : t.ui.themeLight}>
                                {isDark ? <i className="fas fa-sun text-yellow-400"></i> : <i className="fas fa-moon text-gray-600"></i>}
                            </button>
                        </div>
                    </header>

                    <main className="flex-grow pb-24">
                        {activeTab >= 0 && activeTab <= 6 && <ContentModule data={t.content[activeTab]} tabIndex={activeTab} t={t} analytics={analytics} setAnalytics={setAnalytics} isDark={isDark} />}
                        {activeTab === 7 && <InteractiveLabsContainer t={t} />}
                        {activeTab === 8 && <div className="max-w-4xl mx-auto py-20 text-center text-xl text-gray-500 font-bold"><i className="fas fa-link mr-2"></i>外部學習資源 (建置中) / External Resources</div>}
                        {activeTab === 9 && <AnalyticsPage t={t} analytics={analytics} userInfo={userInfo} setUserInfo={setUserInfo} handleExport={handleExport} />}
                        
                        <div className="max-w-4xl mx-auto px-4 flex justify-between mt-8 pt-6 border-t border-gray-200 dark:border-gray-800">
                            <button onClick={() => { if(activeTab > 0) { setActiveTab(activeTab - 1); window.scrollTo(0,0); } }} className={`px-4 py-2 flex items-center ${activeTab === 0 ? 'invisible' : 'text-bcg-navy dark:text-bcg-accent hover:underline font-bold'}`}><i className="fas fa-chevron-left mr-2"></i> {t.ui.prev}</button>
                            <button onClick={() => { if(activeTab < 9) { setActiveTab(activeTab + 1); window.scrollTo(0,0); } }} className={`px-4 py-2 flex items-center ${activeTab === 9 ? 'invisible' : 'text-bcg-navy dark:text-bcg-accent hover:underline font-bold'}`}>{t.ui.next} <i className="fas fa-chevron-right ml-2"></i></button>
                        </div>
                    </main>

                    <footer className="bg-white dark:bg-bcg-darkcard border-t border-gray-200 dark:border-gray-800 h-10 flex items-center justify-between px-4 lg:px-8 text-xs text-gray-500 dark:text-gray-400 fixed bottom-0 w-full z-40 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                        <div>Ver 2026.04 | &copy; 2026 All Rights Reserved.</div>
                        <div className="flex items-center gap-4">
                            <span>Architect: <a href="https://www.ibs.ncnu.edu.tw/index.php/faculty/tenured-professor/299-smlo" target="_blank" className="text-bcg-navy dark:text-bcg-accent hover:underline font-bold">Prof. Shihmin Lo</a></span>
                            <button onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})} className="hover:text-bcg-navy dark:hover:text-white transition font-bold"><i className="fas fa-arrow-up mr-1"></i>Top</button>
                        </div>
                    </footer>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
